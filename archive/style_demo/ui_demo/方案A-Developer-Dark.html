<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案A · Developer Dark · 预览</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
  --blue: #58a6ff; --green: #3fb950; --orange: #d29922; --purple: #a371f7;
  --c0: #161b22; --c1: #0e4429; --c2: #006d32; --c3: #26a641; --c4: #39d353;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, SFMono-Regular, Consolas, monospace;
  --sidebar-w: 220px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; font-family:var(--font); background:var(--bg); color:var(--text); font-size:13px; line-height:1.5; }

/* ===== Topbar ===== */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  height:36px; padding:0 14px; background:var(--bg2); border-bottom:1px solid var(--border);
  flex-shrink:0; font-size:12px;
}
.topbar-left { display:flex; align-items:center; gap:8px; }
.topbar-title { font-weight:600; color:var(--text); font-size:13px; }
.topbar-sub { color:var(--text3); font-size:11px; font-family:var(--mono); }
.topbar-right { display:flex; align-items:center; gap:10px; }
.track-tabs { display:flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
.track-tab {
  padding:2px 10px; font-size:11px; font-weight:500; font-family:var(--font);
  background:var(--bg); color:var(--text2); border:none; cursor:pointer;
}
.track-tab:first-child { border-right:1px solid var(--border); }
.track-tab.active { background:rgba(63,185,80,0.12); color:var(--green); }
.topbar-stats { font-family:var(--mono); font-size:11px; color:var(--text2); }
.topbar-stats strong { color:var(--green); }

/* ===== Progress Bar (inline in topbar) ===== */
.progress-wrap {
  height:2px; background:var(--bg3); flex-shrink:0;
}
.progress-bar { height:100%; width:0%; background:var(--green); transition:width 0.3s; }

/* ===== Layout ===== */
.main-layout { display:flex; height:calc(100% - 36px - 2px); }

/* ===== Sidebar ===== */
.sidebar {
  width:var(--sidebar-w); flex-shrink:0; background:var(--bg2); border-right:1px solid var(--border);
  overflow-y:auto; display:flex; flex-direction:column; gap:2px; padding:8px 0;
}
.sidebar::-webkit-scrollbar { width:4px; }
.sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.side-stage { user-select:none; }
.side-stage-header {
  display:flex; align-items:center; gap:6px; padding:5px 12px; cursor:pointer;
  font-size:12px; color:var(--text2); transition:background 0.1s;
}
.side-stage-header:hover { background:var(--bg3); }
.side-stage-header .arrow { width:12px; font-size:10px; color:var(--text3); transition:transform 0.15s; display:inline-block; }
.side-stage.open > .side-stage-header .arrow { transform:rotate(90deg); }
.side-stage-name { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.side-stage-count { font-family:var(--mono); font-size:10px; color:var(--text3); }

.side-stage-body { display:none; padding-left:16px; }
.side-stage.open > .side-stage-body { display:block; }
.side-section {
  display:block; padding:3px 12px; font-size:11px; color:var(--text3); cursor:pointer;
  transition:background 0.1s; border-radius:3px;
}
.side-section:hover { background:var(--bg3); color:var(--text2); }

/* ===== Content Area ===== */
.content { flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 20px 40px; }
.content::-webkit-scrollbar { width:4px; }
.content::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.view { display:none; }
.view.active { display:block; }

/* ===== Home View ===== */
.stage-card {
  border:1px solid var(--border); border-radius:4px; background:var(--bg2);
  overflow:hidden; margin-bottom:12px;
}
.stage-card.open .stage-body { display:block; }
.stage-card:not(.open) .stage-body { display:none; }

.stage-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 14px; cursor:pointer; user-select:none; transition:background 0.1s;
}
.stage-header:hover { background:var(--bg3); }
.stage-header-left { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.stage-arrow { color:var(--text3); font-size:10px; transition:transform 0.15s; }
.stage-card.open .stage-arrow { transform:rotate(90deg); }
.stage-name { font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stage-count { font-family:var(--mono); font-size:10px; color:var(--text3); flex-shrink:0; }

.stage-body { padding:10px 14px 14px; border-top:1px solid var(--border); }

.section-title {
  font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase;
  letter-spacing:0.5px; margin:10px 0 6px; display:flex; align-items:center; gap:8px;
}
.section-title::after { content:''; flex:1; height:1px; background:var(--border); }
.section-title:first-child { margin-top:0; }

.day-grid { display:flex; flex-wrap:wrap; gap:3px; padding:2px 0; }
.day-cell {
  width:18px; height:18px; border-radius:2px; cursor:pointer; flex-shrink:0;
  transition:outline 0.1s, transform 0.1s; position:relative;
}
.day-cell:hover { outline:2px solid var(--blue); outline-offset:2px; z-index:2; }
.day-cell:active { transform:scale(0.85); }
.day-cell[data-level="0"] { background:var(--c0); border:1px solid var(--border); }
.day-cell[data-level="1"] { background:var(--c1); border:1px solid rgba(48,54,61,0.5); }
.day-cell[data-level="2"] { background:var(--c2); border:1px solid rgba(48,54,61,0.3); }
.day-cell[data-level="3"] { background:var(--c3); border:1px solid rgba(48,54,61,0.2); }
.day-cell[data-level="4"] { background:var(--c4); border:1px solid rgba(48,54,61,0.1); }

.cell-tip {
  position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
  padding:4px 10px; background:var(--bg3); color:var(--text); font-size:11px;
  border-radius:4px; white-space:nowrap; opacity:0; pointer-events:none;
  transition:opacity 0.15s; font-family:var(--mono); z-index:20;
}
.cell-tip::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:4px solid transparent; border-top-color:var(--bg3); }
.day-cell:hover .cell-tip { opacity:1; }

.legend {
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 0 4px; font-size:10px; color:var(--text3);
}
.legend-sq { display:inline-block; width:10px; height:10px; border-radius:2px; }

/* ===== Stats bar (inside home) ===== */
.stats-bar {
  display:flex; justify-content:center; gap:28px; padding:8px 0 14px;
  border-bottom:1px solid var(--border); margin-bottom:12px;
  font-size:11px; color:var(--text2);
}
.stats-bar strong { color:var(--text); font-family:var(--mono); }

/* ===== Day Detail View ===== */
.view--day { padding:0; }
.day-content { max-width:720px; width:100%; margin:0 auto; padding:0 20px 40px; }

.breadcrumb {
  display:flex; align-items:center; gap:8px;
  padding:12px 0 14px; border-bottom:1px solid var(--border);
  font-size:12px; color:var(--text3);
}
.breadcrumb strong { color:var(--text); }
.day-meta { font-size:16px; font-weight:600; color:var(--text); padding:12px 0 4px; }
.day-desc { font-size:13px; line-height:1.7; color:var(--text2); padding:4px 0 12px; border-bottom:1px solid var(--border); }

.sync-badge {
  display:inline-block; padding:3px 10px; margin:8px 0; font-size:11px; font-family:var(--font);
  background:rgba(88,166,255,0.08); color:var(--blue); border:1px solid rgba(88,166,255,0.25);
  border-radius:20px; cursor:pointer; transition:all 0.15s;
}
.sync-badge:hover { background:rgba(88,166,255,0.15); }

.prompt-area { padding:14px 0; border-bottom:1px solid var(--border); }
.prompt-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.prompt-header span { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.5px; }
.btn-copy {
  padding:2px 10px; font-size:11px; font-family:var(--font); background:var(--bg3); color:var(--text2);
  border:1px solid var(--border); border-radius:4px; cursor:pointer; transition:all 0.15s;
}
.btn-copy:hover { background:var(--border); color:var(--text); }
.prompt-content {
  background:var(--bg); border:1px solid var(--border); border-left:2px solid var(--blue);
  border-radius:0 4px 4px 0; padding:12px 14px; font-size:12px; line-height:1.7;
  color:var(--text2); white-space:pre-wrap; word-break:break-word;
  font-family:var(--font); max-height:400px; overflow-y:auto;
}

.task-list { padding:8px 0 0; }
.task-item {
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:4px;
  cursor:pointer; transition:background 0.1s;
}
.task-item:hover { background:var(--bg2); }
.task-item input[type="checkbox"] {
  width:15px; height:15px; flex-shrink:0; accent-color:var(--green); cursor:pointer;
}
.task-item span { font-size:13px; color:var(--text); flex:1; }
.task-item:has(input:checked) span { text-decoration:line-through; color:var(--text3); }
.task-item:has(input:checked) { opacity:0.5; }

.day-footer {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0 24px; font-size:11px; color:var(--text3);
  border-top:1px solid var(--border); margin-top:14px;
}
.day-nav { display:flex; gap:6px; }
.btn-nav {
  padding:3px 12px; font-size:11px; font-family:var(--font); background:var(--bg2); color:var(--text2);
  border:1px solid var(--border); border-radius:4px; cursor:pointer; transition:all 0.15s;
}
.btn-nav:hover { background:var(--bg3); color:var(--text); }
.btn-nav.hidden { visibility:hidden; }

/* ===== Done Overlay ===== */
.done-overlay {
  position:fixed; inset:0; z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(13,17,23,0.92); backdrop-filter:blur(6px);
  opacity:0; pointer-events:none; transition:opacity 0.25s;
}
.done-overlay.show { opacity:1; pointer-events:auto; }
.done-icon {
  width:56px; height:56px; border-radius:50%; background:rgba(63,185,80,0.12);
  border:2px solid var(--green); display:flex; align-items:center; justify-content:center;
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { transform:scale(1); box-shadow:0 0 0 0 rgba(63,185,80,0.25); }
  50% { transform:scale(1.06); box-shadow:0 0 0 12px rgba(63,185,80,0); }
}
#done-msg { margin-top:12px; font-size:14px; font-weight:500; color:var(--text); }

/* ===== Toast ===== */
.toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px);
  background:var(--bg3); color:var(--text); padding:8px 16px;
  border-radius:4px; font-size:12px; opacity:0; transition:all 0.2s;
  pointer-events:none; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ===== Responsive ===== */
@media (max-width:768px) {
  .sidebar { display:none; }
  .day-cell { width:14px; height:14px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">量化学习计划追踪</span>
    <span class="topbar-sub">Day <span id="tb-done">0</span>/<span id="tb-total">3</span></span>
  </div>
  <div class="topbar-right">
    <span class="topbar-stats">Streak: <strong id="tb-streak">0</strong></span>
    <div class="track-tabs" id="track-tabs">
      <button class="track-tab active" data-track="main">主计划</button>
      <button class="track-tab" data-track="math">数学</button>
    </div>
  </div>
</div>
<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<div class="main-layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar"></nav>

  <!-- Content -->
  <div class="content" id="app-content">
    <!-- Home View -->
    <div class="view active" id="view-home">
      <div class="stats-bar" id="stats-bar">
        <span>Done: <strong id="stat-done">0/3</strong></span>
        <span>Progress: <strong id="stat-pct">0%</strong></span>
        <span>Streak: <strong id="stat-streak">0 days</strong></span>
      </div>
      <div id="stage-list"></div>
      <div class="legend">
        <span>未开始</span><i class="legend-sq" style="background:var(--c0);border:1px solid var(--border)"></i>
        <i class="legend-sq" style="background:var(--c1)"></i>
        <i class="legend-sq" style="background:var(--c2)"></i>
        <i class="legend-sq" style="background:var(--c3)"></i>
        <i class="legend-sq" style="background:var(--c4)"></i><span>已完成</span>
      </div>
    </div>

    <!-- Day Detail View -->
    <div class="view view--day" id="view-day">
      <div class="day-content">
        <div class="breadcrumb" id="day-breadcrumb"></div>
        <div class="day-meta" id="day-meta"></div>
        <button class="sync-badge" id="sync-badge" style="display:none"></button>
        <p class="day-desc" id="day-desc"></p>
        <div class="prompt-area">
          <div class="prompt-header"><span>Prompt</span><button class="btn-copy" id="copy-btn">Copy</button></div>
          <pre class="prompt-content" id="prompt-content"></pre>
        </div>
        <div class="task-list" id="task-list"></div>
        <div class="day-footer">
          <span id="day-footer-status"></span>
          <div class="day-nav">
            <button class="btn-nav" id="btn-prev">◀ Prev</button>
            <button class="btn-nav" id="btn-home">Home</button>
            <button class="btn-nav" id="btn-next">Next ▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="done-overlay" id="done-overlay">
  <div class="done-icon">
    <svg width="24" height="24" viewBox="0 0 16 16" fill="none"><path d="M13.78 4.22a.75.75 0 010 1.06l-7.25 7.25a.75.75 0 01-1.06 0L2.22 9.28a.75.75 0 011.06-1.06L6 10.94l6.72-6.72a.75.75 0 011.06 0z" fill="#3fb950"/></svg>
  </div>
  <p id="done-msg"></p>
</div>
<div class="toast" id="toast"></div>

<script>
// ==================== DATA ====================
const MAIN_PLAN = {
  stages: [{
    id:1, name:"阶段一：Python核心概念速览",
    sections:[
      { name:"程序是怎么运行的", daysData:[
        { globalDay:1, title:"变量、数据类型、输入输出", description:"变量不是「存储数据」，而是「给数据贴标签」。今天不背语法——让AI生成代码，你逐行理解每一行在做什么。", prompt:"=== 第1天：变量、数据类型与输入输出 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n建立「变量=给数据贴标签」的核心直觉。理解Python的基本数据类型。\n\n【核心概念】\n- 变量 = 给数据贴标签\n- 基本类型：int/float/str/bool\n- print() 输出 / input() 输入\n\n【练习任务】\n- 让AI写一个程序，你能解释每一行\n- 修改变量值观察输出变化\n- 用自己的话总结四个概念", tasks:["让AI生成代码，逐行理解变量/类型/输入/输出","修改变量值观察输出变化","用自己的话总结四个概念各自的作用"] },
        { globalDay:2, title:"控制流——判断与循环", description:"if让程序做决策，for/while让程序重复劳动。今天不记精确语法——让AI生成含条件判断和循环的代码，你能口述执行流程。", prompt:"=== 第2天：控制流——判断与循环 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n建立「程序可以自己做决策」和「程序可以批量处理」两个核心思维。\n\n【核心概念】\n- if/elif/else：条件判断\n- for循环：遍历数据\n- while循环：条件满足就一直做\n\n【练习任务】\n- 让AI生成含if/for/while的代码，口述执行流程\n- 指出分叉点、循环边界、退出条件\n- 修改条件，预测行为，运行验证", tasks:["让AI生成含三种控制流的代码，口述执行流程","指出分叉点、循环边界、退出条件","修改条件，预测行为，运行验证"] }
      ]},
      { name:"数据结构概念", daysData:[
        { globalDay:3, title:"列表与字典——数据的容器", description:"列表=有序集合，字典=键值对映射。今天不记所有方法名，让AI写代码。你需要的是：看到数据结构，知道怎么描述你想取的数据。", prompt:"=== 第3天：列表与字典 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n建立「数据容器」的思维模型。列表是有序集合，字典是键值映射。\n\n【核心概念】\n- 列表 = 有序集合 [\"股票A\",\"股票B\"]\n- 字典 = 键值对 {\"name\":\"茅台\",\"price\":1800}\n- 列表嵌套字典是实战中最常见的数据格式\n\n【练习任务】\n- 定义一个股票字典列表，让AI提取字段\n- 描述过滤需求→AI写代码→你验证\n- 故意模糊描述，观察AI理解偏差", tasks:["定义股票字典列表，让AI提取字段，你验证","描述过滤需求→AI写代码→你验证输出","故意模糊描述，观察AI的理解偏差"] }
      ]}
    ]
  }],
  _map:null,
  get totalDays(){ return 3; },
  getDay(n){ if(!this._map){ this._map={}; this.stages.forEach(s=>{ s.sections.forEach(sec=>{ sec.daysData.forEach(d=>{ this._map[d.globalDay]={...d,stageName:s.name,sectionName:sec.name}; }); }); }); } return this._map[n]||null; }
};

const MATH_TRACK = {
  modules: [{
    id:1, name:"数学思维基础", subtitle:"从确定性到随机性",
    daysData:[
      { globalDay:1, syncMain:39, title:"函数思维——从Python函数到数学函数", description:"建立「函数 = 确定的映射规则」这一核心直觉。Python 的 def 和数学的 f(x) 本质相同。", prompt:"=== Math Day 1：函数思维 ===\n\n【每日学习时长】约25分钟\n\n【学习目的】\n建立「函数 = 确定的映射规则」这一核心直觉。\n\n【核心概念】\n- 函数 = 确定的映射规则\n- f(x) = 2x + 1：x进去→2x+1出来\n- Python def 和数学函数本质相同\n\n【练习任务】\n- 定义 f(x)=2x+1，生成输出，画折线图\n- 定义 f(x)=x² 和 g(x)=sin(x)，各画一张图\n- 描述三种函数的形状差异", tasks:["定义 f(x)=2x+1，生成输出，画折线图","定义 f(x)=x² 和 g(x)=sin(x)，各画一张图","描述三种函数的形状差异"] },
      { globalDay:2, syncMain:40, title:"坐标与图形——用眼睛理解关系", description:"学会用笛卡尔坐标系把数字关系画出来。折线图的本质：把 x 从小到大排列，看 y 跟着怎么变。", prompt:"=== Math Day 2：坐标与图形 ===\n\n【每日学习时长】约25分钟\n\n【学习目的】\n学会用笛卡尔坐标系把数字关系画出来。\n\n【核心概念】\n- 笛卡尔坐标系：x轴 + y轴\n- 折线图 = 把(x,y)点连起来\n- 图上的「趋势」比数字表直观100倍\n\n【练习任务】\n- 用matplotlib画 f(x)=2x+1 的折线图\n- 同一张图画三条线，不同颜色标注\n- 解释每条线的趋势", tasks:["用matplotlib画 f(x)=2x+1 的折线图","同一张图画三条线，不同颜色标注","解释每条线的趋势"] },
      { globalDay:3, syncMain:41, title:"变化率——斜率的直觉", description:"斜率 = 变化率 = 「x每增加1，y变化多少」。这是导数的前概念，是理解梯度下降的基础。", prompt:"=== Math Day 3：变化率——斜率的直觉 ===\n\n【每日学习时长】约25分钟\n\n【学习目的】\n建立「斜率=变化率」的核心直觉。\n\n【核心概念】\n- 斜率 = Δy/Δx = 变化率\n- 正斜率 = y随x增加而增加\n- 斜率越大 = 变化越快\n\n【练习任务】\n- 计算 f(x)=2x+1 在 x=1到x=3 的斜率\n- 比较三条不同斜率的直线\n- 解释「变化率」在你的生活中意味着什么", tasks:["计算 f(x)=2x+1 的斜率","比较三条不同斜率的直线","解释「变化率」在生活中的含义"] }
    ]
  }],
  _map:null,
  get totalDays(){ return 3; },
  getDay(n){ if(!this._map){ var s=this; this._map={}; s.modules.forEach(function(m){ m.daysData.forEach(function(d){ s._map[d.globalDay]={globalDay:d.globalDay,syncMain:d.syncMain,title:d.title,description:d.description,prompt:d.prompt,tasks:d.tasks,moduleName:m.name}; }); }); } return this._map[n]||null; }
};

// ==================== STATE ====================
var currentTrack = "main";
var currentDay = 1;
var KEY_MAIN = "demo_a_main";
var KEY_MATH = "demo_a_math";

// ==================== STORE ====================
var Store = {
  key: function(){ return currentTrack==="math"?KEY_MATH:KEY_MAIN; },
  load: function(){ try{ var r=localStorage.getItem(this.key()); return r?JSON.parse(r):{}; }catch(e){ return{}; } },
  save: function(d){ localStorage.setItem(this.key(),JSON.stringify(d)); },
  toggleTask: function(day,idx){ var d=this.load(); var dk="d"+day; if(!d[dk]) d[dk]={tasks:[false,false,false]}; d[dk].tasks[idx]=!d[dk].tasks[idx]; this.save(d); },
  isTaskDone: function(day,idx){ var d=this.load(); var dk="d"+day; return !!(d[dk]&&d[dk].tasks&&d[dk].tasks[idx]); },
  isDayDone: function(day){ var d=this.load(); var dk="d"+day; return !!(d[dk]&&d[dk].tasks&&d[dk].tasks.every(function(t){return t;})); },
  getDayLevel: function(day){ var d=this.load(); var dk="d"+day; if(!d[dk]||!d[dk].tasks) return 0; var done=d[dk].tasks.filter(function(t){return t;}).length; if(done===3) return 4; if(done===2) return 3; if(done===1) return 2; return 1; },
  getDoneDays: function(){ var plan=currentTrack==="math"?MATH_TRACK:MAIN_PLAN; var d=this.load(); var c=0; for(var i=1;i<=plan.totalDays;i++){ var dk="d"+i; if(d[dk]&&d[dk].tasks&&d[dk].tasks.every(function(t){return t;})) c++; } return c; },
  getStreak: function(){
    var plan=currentTrack==="math"?MATH_TRACK:MAIN_PLAN;
    var total=plan.totalDays; var data=this.load(); var prefix=currentTrack==="math"?"math":"main";
    var totalDone=0;
    for(var i=1;i<=total;i++){ var dk="d"+i; if(data[dk]&&data[dk].tasks&&data[dk].tasks.every(function(t){return t;})) totalDone++; }
    function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
    var streakStart=localStorage.getItem("streakStart_"+prefix);
    var baseline=parseInt(localStorage.getItem("streakBaseline_"+prefix))||0;
    var today=new Date();
    if(!streakStart){
      var todayStr=fmt(today);
      if(totalDone>0){ var defS=4; var sd=new Date(today.getFullYear(),today.getMonth(),today.getDate()-defS+1); streakStart=fmt(sd); baseline=Math.max(0,totalDone-defS); }
      else { streakStart=todayStr; baseline=0; }
      localStorage.setItem("streakStart_"+prefix,streakStart);
      localStorage.setItem("streakBaseline_"+prefix,String(baseline));
    }
    var tOnly=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    var p=streakStart.split("-"); var sOnly=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
    var daysSince=Math.floor((tOnly-sOnly)/86400000)+1;
    var newlyDone=totalDone-baseline;
    if(newlyDone>=daysSince-1){ var st=Math.min(newlyDone,daysSince); if(st>total) return total; return st; }
    return 0;
  }
};

// ==================== RENDER ====================
function renderHome(){
  var plan=currentTrack==="math"?MATH_TRACK:MAIN_PLAN;
  var doneCount=Store.getDoneDays();
  var total=plan.totalDays;
  var pct=total>0?Math.round(doneCount/total*100):0;
  var streak=Store.getStreak();

  document.getElementById("stat-done").textContent=doneCount+"/"+total;
  document.getElementById("stat-pct").textContent=pct+"%";
  document.getElementById("stat-streak").textContent=streak+" days";
  document.getElementById("progress-bar").style.width=pct+"%";
  document.getElementById("tb-done").textContent=doneCount;
  document.getElementById("tb-total").textContent=total;
  document.getElementById("tb-streak").textContent=streak;

  var stageList=document.getElementById("stage-list");
  stageList.innerHTML="";

  if(currentTrack==="math"){
    MATH_TRACK.modules.forEach(function(mod){
      var card=document.createElement("div"); card.className="stage-card open";
      var hdr=document.createElement("div"); hdr.className="stage-header";
      var hdrL=document.createElement("div"); hdrL.className="stage-header-left";
      hdrL.innerHTML="<span class='stage-arrow'>▶</span><span class='stage-name'>"+mod.name+"</span><span class='stage-count'>"+mod.daysData.length+"天</span>";
      hdr.appendChild(hdrL);
      hdr.addEventListener("click",function(){ card.classList.toggle("open"); });
      card.appendChild(hdr);
      var body=document.createElement("div"); body.className="stage-body";
      var grid=document.createElement("div"); grid.className="day-grid";
      mod.daysData.forEach(function(day){
        var cell=document.createElement("div"); cell.className="day-cell";
        cell.setAttribute("data-level",Store.getDayLevel(day.globalDay));
        var tip=document.createElement("span"); tip.className="cell-tip"; tip.textContent="M"+day.globalDay+": "+day.title;
        cell.appendChild(tip);
        cell.addEventListener("click",function(){ goDay(day.globalDay); });
        grid.appendChild(cell);
      });
      body.appendChild(grid); card.appendChild(body); stageList.appendChild(card);
    });
  } else {
    MAIN_PLAN.stages.forEach(function(stage){
      var card=document.createElement("div"); card.className="stage-card open";
      var hdr=document.createElement("div"); hdr.className="stage-header";
      var hdrL=document.createElement("div"); hdrL.className="stage-header-left";
      hdrL.innerHTML="<span class='stage-arrow'>▶</span><span class='stage-name'>"+stage.name+"</span>";
      hdr.appendChild(hdrL);
      hdr.addEventListener("click",function(){ card.classList.toggle("open"); });
      card.appendChild(hdr);
      var body=document.createElement("div"); body.className="stage-body";
      stage.sections.forEach(function(sec){
        var st=document.createElement("div"); st.className="section-title"; st.textContent=sec.name;
        body.appendChild(st);
        var grid=document.createElement("div"); grid.className="day-grid";
        sec.daysData.forEach(function(day){
          var cell=document.createElement("div"); cell.className="day-cell";
          cell.setAttribute("data-level",Store.getDayLevel(day.globalDay));
          var tip=document.createElement("span"); tip.className="cell-tip"; tip.textContent="Day "+day.globalDay+": "+day.title;
          cell.appendChild(tip);
          cell.addEventListener("click",function(){ goDay(day.globalDay); });
          grid.appendChild(cell);
        });
        body.appendChild(grid);
      });
      card.appendChild(body); stageList.appendChild(card);
    });
  }
  renderSidebar();
}

function renderSidebar(){
  var sb=document.getElementById("sidebar");
  sb.innerHTML="";
  var plan=currentTrack==="math"?MATH_TRACK:MAIN_PLAN;
  if(currentTrack==="math"){
    MATH_TRACK.modules.forEach(function(mod){
      var wrap=document.createElement("div"); wrap.className="side-stage open";
      var hdr=document.createElement("div"); hdr.className="side-stage-header";
      hdr.innerHTML="<span class='arrow'>▶</span><span class='side-stage-name'>"+mod.name+"</span><span class='side-stage-count'>"+mod.daysData.length+"天</span>";
      hdr.addEventListener("click",function(e){ e.stopPropagation(); wrap.classList.toggle("open"); });
      wrap.appendChild(hdr);
      var bd=document.createElement("div"); bd.className="side-stage-body";
      mod.daysData.forEach(function(day){
        var sec=document.createElement("div"); sec.className="side-section";
        sec.textContent="M"+day.globalDay+": "+day.title;
        sec.addEventListener("click",function(e){ e.stopPropagation(); goDay(day.globalDay); });
        bd.appendChild(sec);
      });
      wrap.appendChild(bd); sb.appendChild(wrap);
    });
  } else {
    MAIN_PLAN.stages.forEach(function(stage){
      var wrap=document.createElement("div"); wrap.className="side-stage open";
      var hdr=document.createElement("div"); hdr.className="side-stage-header";
      hdr.innerHTML="<span class='arrow'>▶</span><span class='side-stage-name'>"+stage.name+"</span>";
      hdr.addEventListener("click",function(e){ e.stopPropagation(); wrap.classList.toggle("open"); });
      wrap.appendChild(hdr);
      var bd=document.createElement("div"); bd.className="side-stage-body";
      stage.sections.forEach(function(sec){
        sec.daysData.forEach(function(day){
          var si=document.createElement("div"); si.className="side-section";
          si.textContent="Day "+day.globalDay+": "+day.title;
          si.addEventListener("click",function(e){ e.stopPropagation(); goDay(day.globalDay); });
          bd.appendChild(si);
        });
      });
      wrap.appendChild(bd); sb.appendChild(wrap);
    });
  }
}

function renderDay(globalDay){
  var plan=currentTrack==="math"?MATH_TRACK:MAIN_PLAN;
  var dayData=plan.getDay(globalDay);
  if(!dayData){ goHome(); return; }
  currentDay=globalDay;

  if(currentTrack==="math"){
    document.getElementById("day-breadcrumb").innerHTML="数学 &gt; "+dayData.moduleName+" &gt; <strong>Day "+globalDay+"</strong>";
  } else {
    document.getElementById("day-breadcrumb").innerHTML="主计划 &gt; "+dayData.stageName+" &gt; "+dayData.sectionName+" &gt; <strong>Day "+globalDay+"</strong>";
  }
  document.getElementById("day-meta").textContent="Day "+globalDay+": "+dayData.title;
  document.getElementById("day-desc").textContent=dayData.description;

  var syncBadge=document.getElementById("sync-badge");
  if(currentTrack==="math"&&dayData.syncMain){
    syncBadge.style.display="inline-block";
    syncBadge.textContent="↗ Sync: Main Day "+dayData.syncMain;
    syncBadge.onclick=function(){ currentTrack="main"; switchTrackUI(); goDay(dayData.syncMain); };
  } else { syncBadge.style.display="none"; }

  document.getElementById("prompt-content").textContent=dayData.prompt;

  var taskList=document.getElementById("task-list");
  taskList.innerHTML="";
  dayData.tasks.forEach(function(task,idx){
    var label=document.createElement("label"); label.className="task-item";
    var cb=document.createElement("input"); cb.type="checkbox";
    cb.checked=Store.isTaskDone(globalDay,idx);
    cb.addEventListener("change",function(){
      Store.toggleTask(globalDay,idx);
      updateDayFooter(globalDay);
      renderHome();
      checkAllDone();
    });
    var span=document.createElement("span"); span.textContent=task;
    label.appendChild(cb); label.appendChild(span);
    taskList.appendChild(label);
  });

  updateDayFooter(globalDay);
  checkAllDone();
  document.getElementById("copy-btn").onclick=function(){
    navigator.clipboard.writeText(dayData.prompt).then(function(){ showToast("Prompt copied!"); }).catch(function(){ showToast("Copy failed"); });
  };

  document.getElementById("btn-prev").classList.toggle("hidden",globalDay<=1);
  document.getElementById("btn-next").classList.toggle("hidden",globalDay>=plan.totalDays);
  document.getElementById("btn-prev").onclick=function(){ if(globalDay>1) goDay(globalDay-1); };
  document.getElementById("btn-next").onclick=function(){ if(globalDay<plan.totalDays) goDay(globalDay+1); };
  document.getElementById("btn-home").onclick=function(){ goHome(); };

  document.getElementById("view-home").classList.remove("active");
  document.getElementById("view-day").classList.add("active");
  document.getElementById("done-overlay").classList.remove("show");
  document.getElementById("app-content").scrollTop=0;
}

function updateDayFooter(globalDay){
  var plan=currentTrack==="math"?MATH_TRACK:MAIN_PLAN;
  var done=Store.isDayDone(globalDay);
  var footer=document.getElementById("day-footer-status");
  if(done){ footer.textContent="Day "+globalDay+" / "+plan.totalDays+" — COMPLETE ✓"; }
  else {
    var data=Store.load(); var dk="d"+globalDay;
    var doneCount=(data[dk]&&data[dk].tasks)?data[dk].tasks.filter(function(t){return t;}).length:0;
    var dd=plan.getDay(globalDay); var totalTasks=dd?dd.tasks.length:3;
    footer.textContent="Day "+globalDay+" / "+plan.totalDays+" — Tasks: "+doneCount+"/"+totalTasks;
  }
}

function checkAllDone(){
  var plan=currentTrack==="math"?MATH_TRACK:MAIN_PLAN;
  if(Store.isDayDone(currentDay)){
    var allDone=true;
    for(var i=1;i<=plan.totalDays;i++){ if(!Store.isDayDone(i)){ allDone=false; break; } }
    if(allDone){
      document.getElementById("done-overlay").classList.add("show");
      document.getElementById("done-msg").textContent=currentTrack==="math"?"Math Track Complete!" : "Main Plan Complete!";
    }
  }
}

// ==================== NAVIGATION ====================
function goHome(){
  document.getElementById("view-day").classList.remove("active");
  document.getElementById("view-home").classList.add("active");
  document.getElementById("done-overlay").classList.remove("show");
  renderHome();
}

function goDay(d){
  currentDay=d;
  renderDay(d);
}

function switchTrackUI(){
  var tabs=document.querySelectorAll(".track-tab");
  tabs.forEach(function(t){ t.classList.remove("active"); });
  document.querySelector('[data-track="'+currentTrack+'"]').classList.add("active");
}

// ==================== TOAST ====================
var _toastTimer=null;
function showToast(msg){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer=setTimeout(function(){ t.classList.remove("show"); },2000);
}

// ==================== INIT ====================
function initTabs(){
  document.getElementById("track-tabs").addEventListener("click",function(e){
    if(e.target.classList.contains("track-tab")){
      var track=e.target.getAttribute("data-track");
      if(track===currentTrack) return;
      currentTrack=track;
      switchTrackUI();
      goHome();
    }
  });
}

function init(){
  initTabs();
  renderHome();
}

document.addEventListener("DOMContentLoaded",init);
</script>
