<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Deck · 学习计划追踪器</title>
<style>
/* ===== Glassmorphism-Bento 配色 + Slide Deck 布局 ===== */
:root {
  --bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;
  --glass:rgba(255,255,255,0.06);--glass2:rgba(255,255,255,0.10);--glass3:rgba(255,255,255,0.15);
  --glass-h:rgba(255,255,255,0.14);--g-border:rgba(255,255,255,0.10);--g-border2:rgba(255,255,255,0.16);
  --text:#e8e6f0;--text2:#a09cb8;--text3:#6e6a85;
  --accent:#a78bfa;--accent2:#67e8f9;--success:#6ee7b7;
  --c0:rgba(255,255,255,0.04);--c1:rgba(167,139,250,0.25);--c2:rgba(167,139,250,0.45);--c3:rgba(167,139,250,0.65);--c4:rgba(167,139,250,0.9);
  --font:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","Fira Code",ui-monospace,Consolas,monospace;
  --r:12px;--r-lg:18px;--r-full:9999px;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:15px;line-height:1.6;background:var(--bg1);color:var(--text)}
body{background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%)}
/* decorative orbs */
body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0}
body::before{width:400px;height:400px;top:-100px;right:-80px;background:radial-gradient(circle,rgba(167,139,250,0.14),transparent 70%)}
body::after{width:300px;height:300px;bottom:-60px;left:-60px;background:radial-gradient(circle,rgba(103,232,249,0.1),transparent 70%)}

/* ===== SLIDE DECK ===== */
.deck{position:relative;width:100%;height:100%;overflow:hidden;z-index:1}

/* Top bar (persistent, glass) */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;height:44px;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--g-border);
}
.tb-l{display:flex;align-items:center;gap:10px}
.tb-logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.tb-title{font-size:13px;font-weight:600;color:var(--text)}
.tb-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:var(--r-full);background:rgba(167,139,250,0.12);color:var(--accent);border:1px solid rgba(167,139,250,0.2)}
.tb-r{display:flex;align-items:center;gap:14px;font-size:10px;color:var(--text2)}
.tb-stat{display:flex;align-items:center;gap:3px}
.tb-stat-v{font-weight:600;color:var(--text);font-family:var(--mono);font-size:11px}

/* Slides */
.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:60px 40px 100px;
  opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s;
  background:transparent;
}
.slide.active{opacity:1;visibility:visible}
.slide-inner{width:100%;max-width:760px}
.slide-center{text-align:center}

/* Slide 1: Hero */
.hero-title{font-size:clamp(28px,6vw,52px);font-weight:800;line-height:1.1;letter-spacing:-0.02em;margin-bottom:8px}
.hero-title span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{font-size:16px;color:var(--text2);margin-bottom:32px}

.hero-stats{display:flex;justify-content:center;gap:30px;margin-bottom:36px}
.hero-stat{text-align:center}
.hero-stat-v{font-size:48px;font-weight:900;font-family:var(--mono);background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.hero-stat-l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

.track-switch{display:inline-flex;border:1px solid var(--g-border2);border-radius:var(--r);overflow:hidden;background:var(--glass)}
.track-switch button{padding:8px 24px;font-size:13px;font-weight:600;font-family:var(--font);border:none;cursor:pointer;background:transparent;color:var(--text2);transition:all .2s var(--ease)}
.track-switch button:first-child{border-right:1px solid var(--g-border)}
.track-switch button.active{background:rgba(167,139,250,0.2);color:var(--accent)}
.track-switch button:hover:not(.active){color:var(--text)}

/* Stage slides */
.stage-title{font-size:14px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stage-name{font-size:32px;font-weight:800;color:var(--text);margin-bottom:24px;line-height:1.2}
.sec-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.day-grid{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0;justify-content:center}
.day-cell{width:40px;height:40px;border-radius:8px;cursor:pointer;flex-shrink:0;transition:all .15s var(--ease);position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:var(--mono)}
.day-cell:hover{transform:scale(1.15);z-index:2;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.day-cell:active{transform:scale(0.9)}
.day-cell[data-lv="0"]{background:var(--c0);border:1px solid var(--g-border);color:var(--text3)}
.day-cell[data-lv="1"]{background:var(--c1);border:1px solid rgba(167,139,250,0.15);color:var(--text2)}
.day-cell[data-lv="2"]{background:var(--c2);border:1px solid rgba(167,139,250,0.25);color:var(--text)}
.day-cell[data-lv="3"]{background:var(--c3);border:1px solid rgba(167,139,250,0.35);color:#fff}
.day-cell[data-lv="4"]{background:var(--c4);box-shadow:0 0 14px rgba(167,139,250,0.3);color:#fff}

/* Day detail slide (modal style overlay) */
.detail-overlay{
  position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;
  background:rgba(15,12,41,0.96);backdrop-filter:blur(20px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)
}
.detail-overlay.show{opacity:1;pointer-events:auto}
.detail-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--g-border);flex-shrink:0}
.detail-bc{font-size:11px;color:var(--text3)}
.detail-bc strong{color:var(--accent)}
.detail-body{flex:1;overflow-y:auto;padding:20px 24px 40px;max-width:680px;width:100%;margin:0 auto}
.detail-body::-webkit-scrollbar{width:4px}
.detail-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}

.detail-day{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.detail-title{font-size:24px;font-weight:700;color:var(--text);margin:4px 0 12px;line-height:1.3}
.detail-desc{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--g-border)}

.prompt-block{background:var(--glass);border:1px solid var(--g-border2);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.prompt-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--glass2);border-bottom:1px solid var(--g-border)}
.prompt-hd span{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
.prompt-hd span::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:2px}
.prompt-body{padding:16px;font-size:12px;line-height:1.7;color:var(--text2);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto}
.prompt-body::-webkit-scrollbar{width:4px}.prompt-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.06);border-radius:2px}

.task-list{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-radius:var(--r);cursor:pointer;transition:all .2s var(--ease);background:var(--glass);border:1px solid transparent}
.task-item:hover{background:var(--glass2);border-color:var(--g-border2)}
.task-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--g-border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.task-item.done .task-chk{background:var(--success);border-color:var(--success);box-shadow:0 0 10px rgba(110,231,183,0.3)}
.task-chk svg{opacity:0}.task-item.done .task-chk svg{opacity:1}
.task-txt{font-size:13px;color:var(--text);flex:1}.task-item.done .task-txt{text-decoration:line-through;color:var(--text3)}.task-item.done{opacity:.55}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;height:60px;
  display:flex;align-items:center;justify-content:center;gap:20px;
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--g-border);
}
.nav-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--g-border2);cursor:pointer;transition:all .2s var(--ease);background:transparent}
.nav-dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(167,139,250,0.4)}
.nav-dot:hover:not(.active){border-color:var(--text3)}
.nav-arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--g-border2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:14px;transition:all .2s var(--ease);background:var(--glass)}
.nav-arrow:hover{background:var(--glass2);border-color:var(--text3);color:var(--text)}

/* Toast/buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;font-size:11px;font-weight:500;font-family:var(--font);border:1px solid var(--g-border2);border-radius:var(--r);background:var(--glass2);color:var(--text2);cursor:pointer;transition:all .2s var(--ease);backdrop-filter:blur(8px)}
.btn:hover{background:var(--glass3);color:var(--text)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(167,139,250,0.3)}
.btn.copy.copied{background:rgba(110,231,183,0.15);border-color:var(--success);color:var(--success)}
.btn-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--g-border2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);background:var(--glass);font-size:18px;transition:all .2s var(--ease)}
.btn-close:hover{background:var(--glass3);color:var(--text)}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 20px;background:rgba(15,12,41,0.95);color:#fff;border-radius:var(--r-full);font-size:12px;font-weight:500;opacity:0;pointer-events:none;z-index:300;border:1px solid var(--g-border2);backdrop-filter:blur(12px);transition:all .3s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:768px){
  .slide{padding:50px 20px 90px}
  .hero-stats{gap:16px}
  .hero-stat-v{font-size:34px}
  .day-cell{width:32px;height:32px;font-size:11px}
  .detail-body{padding:16px 16px 32px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-l"><div class="tb-logo">◆</div><span class="tb-title">量化学习计划追踪</span><span class="tb-badge" id="tb-badge">主计划</span></div>
  <div class="tb-r"><div class="tb-stat">完成 <span class="tb-stat-v" id="tb-done">0/8</span></div><div class="tb-stat">进度 <span class="tb-stat-v" id="tb-pct">0%</span></div><div class="tb-stat">连续 <span class="tb-stat-v" id="tb-streak">0d</span></div></div>
</div>

<div class="deck" id="deck"></div>

<div class="bottom-nav" id="bottom-nav"></div>

<div class="detail-overlay" id="detail-overlay">
  <div class="detail-header">
    <div class="detail-bc" id="detail-bc"></div>
    <div class="btn-close" onclick="closeDetail()">×</div>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
var MAIN_PLAN={name:'主计划',stages:[{id:1,name:'阶段一：Python核心概念速览',sections:[{name:'程序是怎么运行的',days:[{d:1,title:'变量、数据类型、输入输出',desc:'变量不是「存储数据」，而是「给数据贴标签」。',prompt:'=== 第1天：变量、数据类型与输入输出 ===\n\n【学习时长】约3小时\n【学习目的】建立变量=给数据贴标签的直觉。\n【核心概念】\n- 变量/类型/print/input\n【练习任务】\n- 让AI生成代码，逐行理解\n- 修改变量值观察变化\n- 自己总结概念',tasks:['让AI生成代码，逐行理解','修改变量值观察输出变化','自己总结概念']},{d:2,title:'控制流——判断与循环',desc:'if让程序做决策，for/while让程序重复劳动。',prompt:'=== 第2天：控制流 ===\n\n【学习时长】约3小时\n【学习目的】程序自主决策与批量处理。\n【核心概念】if/for/while\n【练习任务】\n- 口述执行流程\n- 指出分叉点/循环边界\n- 修改条件验证',tasks:['口述代码执行流程','指出分叉点/循环边界','修改条件预测行为']}]},{name:'数据结构概念',days:[{d:3,title:'列表与字典——数据的容器',desc:'列表=有序集合，字典=键值对映射。',prompt:'=== 第3天：列表与字典 ===\n\n【学习时长】约3小时\n【学习目的】数据容器的思维模型。\n【核心概念】列表/字典\n【练习任务】\n- 定义股票字典列表\n- 让AI提取字段\n- 模糊描述观察偏差',tasks:['定义股票字典列表','描述过滤需求→AI验证','故意模糊描述']}]}]},{id:2,name:'阶段二：数据处理入门',sections:[{name:'文件与数据读写',days:[{d:4,title:'文件读写基础',desc:'程序只有能读取外部数据才算真正有用。',prompt:'=== 第4天：文件读写 ===\n\n【学习时长】约3小时\n【练习任务】\n- 创建文件写入\n- 读取统计\n- with语句改写',tasks:['创建文件写入10行','读取统计行数和字数','with语句改写']},{d:5,title:'CSV与JSON',desc:'CSV是表格，JSON是嵌套结构。',prompt:'=== 第5天：CSV与JSON ===\n\n【学习时长】约2.5小时\n【练习任务】\n- csv.DictReader\n- json序列化\n- CSV→JSON',tasks:['csv.DictReader读取','json序列化','CSV→JSON转换']}]},{name:'数据分析基础',days:[{d:6,title:'数据清洗',desc:'真实数据从来都不干净。',prompt:'=== 第6天：数据清洗 ===\n\n【学习时长】约2.5小时\n【练习任务】统计缺失/中位数填充/IQR检测',tasks:['统计缺失比例','中位数填充','IQR检测异常值']},{d:7,title:'数据可视化',desc:'一张好图胜过千行数据。',prompt:'=== 第7天：数据可视化 ===\n\n【学习时长】约3小时\n【练习任务】折线图/柱状图/散点图',tasks:['画折线图','画柱状图','画散点图']},{d:8,title:'数据分析报告',desc:'分析的终点是结论。',prompt:'=== 第8天：数据分析报告 ===\n\n【学习时长】约3小时\n【练习任务】提问题/清洗可视化/写结论',tasks:['提出3个问题','清洗+可视化','写结论']}]}]}],_map:null,totalDays:8,getDay(n){if(!this._map){this._map={};this.stages.forEach(s=>{s.sections.forEach(sec=>{sec.days.forEach(d=>{this._map[d.d]={...d,stageName:s.name,sectionName:sec.name}})})})}return this._map[n]||null}};
var MATH_TRACK={name:'数学',modules:[{id:1,name:'数学思维基础',days:[{d:1,sync:39,title:'函数思维',desc:'建立函数=映射规则的直觉。',prompt:'=== MATH DAY 1：函数思维 ===\n\n【学习时长】约25分钟\n【练习任务】f(x)=2x+1/x²/sin(x)',tasks:['f(x)=2x+1画折线图','f(x)=x²和g(x)=sin(x)','描述形状差异']},{d:2,sync:40,title:'坐标与图形',desc:'用坐标系把数字关系画出来。',prompt:'=== MATH DAY 2：坐标与图形 ===\n\n【学习时长】约25分钟\n【练习任务】画折线图/三条线/解释趋势',tasks:['matplotlib画折线图','三条线不同颜色','解释趋势']},{d:3,sync:41,title:'变化率——斜率',desc:'斜率=x每增加1，y变化多少。',prompt:'=== MATH DAY 3：斜率 ===\n\n【学习时长】约25分钟\n【练习任务】计算/比较/解释',tasks:['计算斜率','比较不同斜率','解释含义']}]},{id:3,name:'模块三：线性代数基础',days:[{d:24,sync:null,title:'向量是什么',desc:'在AI中768维Embedding也是向量。',prompt:'=== MATH DAY 24：向量 ===\n\n【学习时长】约25分钟\n【练习任务】画向量/理解Embedding/解释方向',tasks:['画出二维向量','理解Embedding','解释方向和大小']},{d:27,sync:42,title:'向量点积——相似度的根源',desc:'ChromaDB/RAG的数学基础。夹角越小语义越接近。',prompt:'=== MATH DAY 27：向量点积 ===\n\n【学习时长】约25分钟\n【关联】Main Day 42\n【学习目的】点积=方向一致性度量\n【核心概念】\n- 点积 v·w = |v||w|cos(θ)\n- θ=0°→cos=1→最大\n- θ=90°→cos=0\n- θ=180°→cos=-1\n- 余弦相似度∈[-1,+1]\n【练习任务】\n- v1=[1,2],v2=[2,4],v3=[-2,1]\n- 写cosine_sim()\n- 画图解释夹角',tasks:['手算 v1·v2 和 v1·v3','写 cosine_sim() 函数','画图解释夹角']}]}],_map:null,getDay(n){if(!this._map){this._map={};this.modules.forEach(m=>{m.days.forEach(d=>{this._map[d.d]={...d,moduleName:m.name}})})}return this._map[n]||null},allDays(){let a=[];this.modules.forEach(m=>{m.days.forEach(d=>a.push(d))});return a.sort((x,y)=>x.d-y.d)}};
// ===== STATE ====
var currentTrack='main',slideIndex=0,currentDay=null,KEY_MAIN='sd_main',KEY_MATH='sd_math';
var Store={key(){return currentTrack==='math'?KEY_MATH:KEY_MAIN},load(){try{return JSON.parse(localStorage.getItem(this.key()))||{}}catch(e){return{}}},save(d){localStorage.setItem(this.key(),JSON.stringify(d))},toggleTask(day,idx){let d=this.load(),dk='d'+day;if(!d[dk])d[dk]={tasks:[false,false,false]};d[dk].tasks[idx]=!d[dk].tasks[idx];this.save(d)},isTaskDone(day,idx){return!!(this.load()['d'+day]&&this.load()['d'+day].tasks&&this.load()['d'+day].tasks[idx])},isDayDone(day){return!!(this.load()['d'+day]&&this.load()['d'+day].tasks&&this.load()['d'+day].tasks.every(t=>t))},getLevel(day){let d=this.load(),dk='d'+day;if(!d[dk]||!d[dk].tasks)return 0;let done=d[dk].tasks.filter(t=>t).length;if(done===3)return 4;if(done===2)return 3;if(done===1)return 2;return 1},getDoneCount(){let c=0;if(currentTrack==='math'){MATH_TRACK.allDays().forEach(d=>{if(this.isDayDone(d.d))c++})}else{for(let i=1;i<=MAIN_PLAN.totalDays;i++){if(this.isDayDone(i))c++}}return c},getStreak(){let doneCount=this.getDoneCount(),prefix=currentTrack==='math'?'sd_ms':'sd_ms2';function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}let today=new Date(),ss=localStorage.getItem('ss_'+prefix),baseline=parseInt(localStorage.getItem('bl_'+prefix))||0;if(!ss){if(doneCount>0){let defS=4,sd=new Date(today.getFullYear(),today.getMonth(),today.getDate()-defS+1);ss=fmt(sd);baseline=Math.max(0,doneCount-defS)}else{ss=fmt(today);baseline=0}localStorage.setItem('ss_'+prefix,ss);localStorage.setItem('bl_'+prefix,String(baseline))}let tOnly=new Date(today.getFullYear(),today.getMonth(),today.getDate()),p=ss.split('-'),sOnly=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])),daysSince=Math.floor((tOnly-sOnly)/86400000)+1,newlyDone=doneCount-baseline;if(newlyDone>=daysSince-1)return Math.min(newlyDone,daysSince);return 0}};
function getPlan(){return currentTrack==='math'?MATH_TRACK:MAIN_PLAN}

// ===== BUILD SLIDES =====
function buildDeck(){
  let plan=getPlan(),deck=document.getElementById('deck'),nav=document.getElementById('bottom-nav');
  deck.innerHTML='';nav.innerHTML='';
  let slides=[];
  // Slide 0: Hero
  let done=Store.getDoneCount(),total=currentTrack==='math'?MATH_TRACK.allDays().length:MAIN_PLAN.totalDays;
  let pct=total>0?Math.round(done/total*100):0,streak=Store.getStreak();
  slides.push({type:'hero',html:'<div class="slide-inner slide-center"><h1 class="hero-title">量化<span>学习</span>计划</h1><p class="hero-sub">'+plan.name+' · '+done+'/'+total+' 天完成 · 连续 '+streak+' 天</p><div class="hero-stats"><div class="hero-stat"><div class="hero-stat-v">'+done+'</div><div class="hero-stat-l">已完成</div></div><div class="hero-stat"><div class="hero-stat-v">'+pct+'%</div><div class="hero-stat-l">进度</div></div><div class="hero-stat"><div class="hero-stat-v">'+streak+'</div><div class="hero-stat-l">连续天数</div></div></div><div class="track-switch"><button class="'+(currentTrack==='main'?'active':'')+'" onclick="switchTrack(\'main\')">主计划</button><button class="'+(currentTrack==='math'?'active':'')+'" onclick="switchTrack(\'math\')">数学</button></div></div>'});
  // Stage/module slides
  if(currentTrack==='math'){
    MATH_TRACK.modules.forEach(mod=>{
      let grid='<div class="day-grid">';
      mod.days.forEach(day=>{grid+='<div class="day-cell" data-lv="'+Store.getLevel(day.d)+'" onclick="openDetail('+day.d+')">M'+day.d+'</div>'});
      grid+='</div>';
      slides.push({type:'stage',html:'<div class="slide-inner slide-center"><div class="stage-title">'+plan.name+'</div><div class="stage-name">'+mod.name+'</div>'+grid+'</div>'});
    })
  } else {
    MAIN_PLAN.stages.forEach(stage=>{
      let html='<div class="slide-inner"><div class="stage-title">'+plan.name+'</div><div class="stage-name">'+stage.name+'</div>';
      stage.sections.forEach(sec=>{
        html+='<div class="sec-label">'+sec.name+'</div><div class="day-grid">';
        sec.days.forEach(day=>{html+='<div class="day-cell" data-lv="'+Store.getLevel(day.d)+'" onclick="openDetail('+day.d+')">D'+day.d+'</div>'});
        html+='</div>';
      });
      html+='</div>';
      slides.push({type:'stage',html:html});
    })
  }
  // Render
  slides.forEach((s,i)=>{
    let el=document.createElement('div');el.className='slide'+(i===0?' active':'');
    el.innerHTML=s.html;deck.appendChild(el);
    let dot=document.createElement('div');dot.className='nav-dot'+(i===0?' active':'');
    dot.addEventListener('click',()=>goSlide(i));nav.appendChild(dot);
  });
  // Nav arrows
  let prevA=document.createElement('div');prevA.className='nav-arrow';prevA.textContent='←';
  prevA.addEventListener('click',()=>goSlide(slideIndex-1));nav.prepend(prevA);
  let nextA=document.createElement('div');nextA.className='nav-arrow';nextA.textContent='→';
  nextA.addEventListener('click',()=>goSlide(slideIndex+1));nav.appendChild(nextA);
  slideIndex=0;updateStats();
}

function goSlide(n){
  let slides=document.querySelectorAll('.slide'),dots=document.querySelectorAll('.nav-dot');
  if(n<0||n>=slides.length)return;
  slides.forEach(s=>s.classList.remove('active'));dots.forEach(d=>d.classList.remove('active'));
  slides[n].classList.add('active');dots[n].classList.add('active');slideIndex=n;
}

function openDetail(day){
  currentDay=day;let plan=getPlan(),dd=plan.getDay(day);if(!dd)return;
  let ol=document.getElementById('detail-overlay'),body=document.getElementById('detail-body');
  document.getElementById('detail-bc').innerHTML=currentTrack==='math'?'数学 › '+dd.moduleName+' › <strong>Day '+day+'</strong>':'主计划 › '+dd.stageName+' › '+dd.sectionName+' › <strong>Day '+day+'</strong>';
  body.innerHTML='<div class="detail-day">Day '+day+'</div><h2 class="detail-title">'+dd.title+'</h2>';
  if(currentTrack==='math'&&dd.sync)body.innerHTML+='<div style="margin-bottom:12px"><button class="btn" style="font-size:10px" onclick="currentTrack=\'main\';closeDetail();switchTrack(\'main\');openDetail('+dd.sync+')">↗ Sync: Main Day '+dd.sync+'</button></div>';
  body.innerHTML+='<p class="detail-desc">'+dd.desc+'</p>';
  body.innerHTML+='<div class="prompt-block"><div class="prompt-hd"><span>Prompt</span><button class="btn copy" id="copy-btn" onclick="copyPrompt()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button></div><pre class="prompt-body" id="prompt-body">'+dd.prompt+'</pre></div>';
  body.innerHTML+='<div class="task-list">';
  dd.tasks.forEach((task,idx)=>{
    let done=Store.isTaskDone(day,idx);
    body.innerHTML+='<label class="task-item'+(done?' done':'')+'" data-tidx="'+idx+'"><div class="task-chk"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><span class="task-txt">'+task+'</span></label>';
  });
  body.innerHTML+='</div><div class="btn-group" style="display:flex;gap:8px"><button class="btn" onclick="closeDetail()">← Back</button><button class="btn primary" onclick="closeDetail()">Done</button></div>';
  ol.classList.add('show');
  // Attach task listeners
  setTimeout(()=>{
    body.querySelectorAll('.task-item').forEach(item=>{
      item.addEventListener('click',function(){
        let idx=parseInt(this.getAttribute('data-tidx'));
        Store.toggleTask(currentDay,idx);this.classList.toggle('done');
        buildDeck();showToast('Task updated');
      })
    })
  },100);
}

function closeDetail(){document.getElementById('detail-overlay').classList.remove('show');currentDay=null}
function switchTrack(track){if(track===currentTrack)return;currentTrack=track;buildDeck()}
function updateStats(){let plan=getPlan(),done=Store.getDoneCount(),total=currentTrack==='math'?MATH_TRACK.allDays().length:plan.totalDays,pct=total>0?Math.round(done/total*100):0,streak=Store.getStreak();document.getElementById('tb-done').textContent=done+'/'+total;document.getElementById('tb-pct').textContent=pct+'%';document.getElementById('tb-streak').textContent=streak+'d';let badge=document.getElementById('tb-badge');badge.textContent=plan.name}

var _toastTimer=null;
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(_toastTimer)clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2000)}
function copyPrompt(){let text=document.getElementById('prompt-body').textContent;navigator.clipboard.writeText(text).then(()=>{let btn=document.getElementById('copy-btn');btn.classList.add('copied');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!';showToast('✓ Copied!');setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy'},1800)}).catch(()=>showToast('Copy failed'))}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){e.preventDefault();goSlide(slideIndex+1)}
  if(e.key==='ArrowLeft'){e.preventDefault();goSlide(slideIndex-1)}
  if(e.key==='Escape')closeDetail()
});
document.addEventListener('DOMContentLoaded',function(){buildDeck()});
</script>
</body>
</html>
