<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brutalism Poster · 学习计划追踪器</title>
<style>
/* ================================================================
   Brutalism Poster — Concrete Poetry 流派
   参考: canvas-design-system.md §Concrete Poetry
        ui-ux-pro-max §Brutalism
   特征: #000底色 · 零圆角 · 巨型粗体字 · 荧光绿强调
        粗野分割线 · 不对称布局 · 文本=稀有武器
   ================================================================ */

:root {
  --bg: #000000;
  --bg2: #0a0a0a;
  --bg3: #141414;
  --border: #2a2a2a;
  --border2: #444444;
  --text: #f0f0f0;
  --text2: #999999;
  --text3: #666666;
  --acid: #00ff41;
  --acid2: #39ff14;
  --yellow: #ffff00;
  --red: #ff3333;
  --font: "Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono: "JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,Consolas,monospace;
  /* BRUTALIST: 零圆角 */
  --r: 0px;
  --ease: steps(4);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:14px;line-height:1.4;background:var(--bg);color:var(--text)}
html{font-size:14px}

/* ===== TOPBAR ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  height:52px;padding:0 20px;flex-shrink:0;
  background:var(--bg);border-bottom:3px solid var(--border2);
}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-logo{
  width:32px;height:32px;background:var(--acid);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#000;font-family:var(--mono);
  clip-path:polygon(0 0,100% 0,100% 70%,70% 100%,0 100%);
}
.tb-title{font-size:15px;font-weight:900;color:var(--text);letter-spacing:0.02em;text-transform:uppercase}

.tb-center{display:flex;border:3px solid var(--border2);background:var(--bg)}
.tb-track{padding:6px 20px;font-size:12px;font-weight:700;font-family:var(--font);border:none;cursor:pointer;background:transparent;color:var(--text2);text-transform:uppercase;letter-spacing:0.04em;transition:all 0.1s}
.tb-track:first-child{border-right:3px solid var(--border2)}
.tb-track.active{background:var(--acid);color:#000}
.tb-track:hover:not(.active){background:var(--bg3);color:var(--text)}

.tb-r{display:flex;align-items:center;gap:20px;font-size:11px;color:var(--text2);font-family:var(--mono);font-weight:600}
.tb-stat{display:flex;align-items:center;gap:6px}
.tb-stat-v{font-weight:900;color:var(--acid);font-size:14px}

/* Progress */
.progress-wrap{height:4px;background:var(--bg3);flex-shrink:0}
.progress-bar{height:100%;width:0;background:var(--acid);transition:width 0.3s steps(8)}

/* ===== LAYOUT ===== */
.app-layout{display:flex;height:calc(100vh - 52px - 4px)}

/* ===== SIDEBAR — raw ===== */
.sidebar{
  width:220px;flex-shrink:0;overflow-y:auto;padding:0;
  background:var(--bg2);border-right:3px solid var(--border2);
  transition:transform .2s
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2)}

.side-stage{border-bottom:2px solid var(--border)}
.side-stage-hd{
  display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;
  font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;
  letter-spacing:0.04em;transition:background 0.05s
}
.side-stage-hd:hover{background:var(--bg3)}
.side-arrow{font-size:10px;color:var(--acid);transition:transform .1s;display:inline-block;font-family:var(--mono)}
.side-stage.open>.side-stage-hd .side-arrow{transform:rotate(90deg)}
.side-stage-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-stage-n{font-family:var(--mono);font-size:10px;color:var(--text3)}

.side-body{display:none}
.side-stage.open>.side-body{display:block}
.side-item{
  display:flex;align-items:center;gap:8px;padding:6px 14px 6px 22px;
  font-size:11px;font-weight:500;font-family:var(--mono);color:var(--text3);
  cursor:pointer;transition:all 0.05s;border-left:3px solid transparent
}
.side-item:hover{background:var(--bg3);color:var(--text2);border-left-color:var(--border2)}
.side-item.active{background:var(--bg3);color:var(--acid);border-left-color:var(--acid);font-weight:700}
.side-dot{display:inline-block;width:8px;height:8px;flex-shrink:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.side-dot.d0{background:var(--bg3);border:1px solid var(--border2)}.side-dot.d1{background:rgba(0,255,65,0.2)}
.side-dot.d2{background:rgba(0,255,65,0.4)}.side-dot.d3{background:rgba(0,255,65,0.7)}.side-dot.d4{background:var(--acid)}

/* ===== CONTENT ===== */
.content{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--border2)}
.view{display:none}
.view.active{display:block}

/* ===== HOME VIEW ===== */
.home{padding:24px 24px 40px;max-width:880px;margin:0 auto}

/* STAT BLOCKS */
.stat-blocks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-bottom:20px;border:3px solid var(--border2)}
.stat-blk{padding:24px 20px;background:var(--bg2);border-right:3px solid var(--border2);text-align:center}
.stat-blk:last-child{border-right:none}
.stat-blk-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
.stat-blk-val{font-size:42px;font-weight:900;color:var(--acid);font-family:var(--mono);line-height:1}
.stat-blk-sub{font-size:11px;color:var(--text3);margin-top:4px;font-family:var(--mono)}

/* STAGE BLOCKS */
.stage-block{border:3px solid var(--border2);margin-bottom:16px;background:var(--bg2)}
.stage-block.open .stage-body{display:block}
.stage-block:not(.open) .stage-body{display:none}

.stage-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;cursor:pointer;user-select:none;
  border-bottom:2px solid var(--border);transition:background 0.05s
}
.stage-hd:hover{background:var(--bg3)}
.stage-hd-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.stage-arrow{color:var(--acid);font-size:12px;font-weight:900;transition:transform .1s;font-family:var(--mono)}
.stage-block.open .stage-arrow{transform:rotate(90deg)}
.stage-name{font-size:14px;font-weight:900;color:var(--text);text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-meta{font-family:var(--mono);font-size:10px;color:var(--text3);font-weight:700}

.stage-body{padding:14px 18px 18px}

.sec-title{
  font-size:10px;font-weight:900;color:var(--text3);text-transform:uppercase;
  letter-spacing:0.08em;margin:14px 0 8px;padding-bottom:6px;
  border-bottom:2px solid var(--border)
}
.sec-title:first-child{margin-top:0}

.day-grid{display:flex;flex-wrap:wrap;gap:4px;padding:4px 0}
.day-cell{
  width:24px;height:24px;cursor:pointer;flex-shrink:0;
  transition:all 0.05s;position:relative
}
.day-cell:hover{outline:3px solid var(--acid);outline-offset:2px;z-index:2;transform:scale(1.2)}
.day-cell:active{transform:scale(0.85)}
.day-cell[data-lv="0"]{background:var(--bg3);border:2px solid var(--border)}
.day-cell[data-lv="1"]{background:rgba(0,255,65,0.15);border:2px solid rgba(0,255,65,0.2)}
.day-cell[data-lv="2"]{background:rgba(0,255,65,0.3);border:2px solid rgba(0,255,65,0.35)}
.day-cell[data-lv="3"]{background:rgba(0,255,65,0.55);border:2px solid rgba(0,255,65,0.6)}
.day-cell[data-lv="4"]{background:var(--acid);border:2px solid var(--acid)}

.cell-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:5px 10px;background:#000;color:var(--acid);font-size:10px;border:2px solid var(--acid);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s;z-index:20;font-family:var(--mono);font-weight:600}
.cell-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--acid)}
.day-cell:hover .cell-tip{opacity:1}

.legend{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 0 0;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em}
.legend-sq{display:inline-block;width:12px;height:12px;border:2px solid var(--border2)}

/* ===== DAY VIEW ===== */
.day-view{padding:0}
.day-inner{max-width:720px;margin:0 auto;padding:0 24px 40px}

.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:18px 0;border-bottom:3px solid var(--border2);font-size:12px;font-family:var(--mono);font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.04em}
.breadcrumb .cur{color:var(--acid)}

.day-hd{padding:20px 0 0}
.day-label{font-size:12px;font-weight:900;color:var(--acid);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;font-family:var(--mono)}
.day-meta{font-size:32px;font-weight:900;line-height:1.15;color:var(--text);text-transform:uppercase;letter-spacing:-0.01em}
.day-hd{border-bottom:3px solid var(--border);padding-bottom:16px}

.sync-row{padding:14px 0}
.sync-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:11px;font-weight:700;font-family:var(--mono);background:#000;color:var(--acid);border:2px solid var(--acid);cursor:pointer;transition:all 0.05s;text-transform:uppercase;letter-spacing:0.04em}
.sync-badge:hover{background:var(--acid);color:#000}

.day-desc{padding:10px 0 18px;font-size:14px;line-height:1.7;color:var(--text2);border-bottom:2px solid var(--border);font-weight:500}

/* Prompt */
.prompt-block{margin-top:18px;border:3px solid var(--border2);background:var(--bg2)}
.prompt-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--bg3);border-bottom:2px solid var(--border)}
.prompt-label{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:900;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--mono)}
.prompt-label::before{content:'>_';color:var(--acid);font-size:12px}
.prompt-body{padding:18px;font-size:12px;line-height:1.8;color:var(--text2);white-space:pre-wrap;word-break:break-word;font-family:var(--mono);max-height:400px;overflow-y:auto;background:#000}
.prompt-body::-webkit-scrollbar{width:6px}
.prompt-body::-webkit-scrollbar-thumb{background:var(--border2)}

/* Tasks */
.task-section{margin-top:18px}
.task-section-hd{font-size:10px;font-weight:900;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;font-family:var(--mono)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;cursor:pointer;transition:all 0.05s;border-left:3px solid transparent;margin-bottom:2px}
.task-item:hover{background:var(--bg2);border-left-color:var(--border2)}
.task-chk{width:20px;height:20px;border:3px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:all 0.05s}
.task-item:hover .task-chk{border-color:var(--acid)}
.task-item.done .task-chk{background:var(--acid);border-color:var(--acid)}
.task-chk svg{opacity:0;transition:opacity 0s}
.task-item.done .task-chk svg{opacity:1}
.task-txt{font-size:13px;color:var(--text);flex:1;line-height:1.5;font-weight:500;transition:all 0.05s}
.task-item.done .task-txt{text-decoration:line-through;color:var(--text3)}
.task-item.done{opacity:.5}

/* Footer */
.day-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:18px;border-top:3px solid var(--border2);font-size:12px;font-family:var(--mono);font-weight:600;color:var(--text3)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;font-size:12px;font-weight:700;font-family:var(--mono);border:3px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:all 0.05s;text-transform:uppercase;letter-spacing:0.04em}
.btn:hover{background:var(--bg3);border-color:var(--text3);color:var(--text)}
.btn:focus-visible{outline:3px solid var(--acid);outline-offset:3px}
.btn.primary{background:var(--acid);color:#000;border-color:var(--acid)}
.btn.primary:hover{background:var(--acid2);border-color:var(--acid2)}
.btn.copy.copied{background:var(--acid);color:#000;border-color:var(--acid)}
.btn-group{display:flex;gap:0}
.btn-group .btn{margin-left:-3px}
.btn-group .btn:first-child{margin-left:0}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.96);opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.ov-icon{width:72px;height:72px;background:var(--acid);display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
@keyframes ov-flash{0%,100%{opacity:1}50%{opacity:0.3}}
.ov-icon svg{width:32px;height:32px}
.ov-msg{margin-top:18px;font-size:22px;font-weight:900;color:var(--acid);text-transform:uppercase;letter-spacing:0.06em;font-family:var(--mono)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:8px;padding:10px 20px;background:#000;color:var(--acid);border:3px solid var(--acid);font-size:12px;font-weight:700;font-family:var(--mono);opacity:0;pointer-events:none;z-index:300;transition:all .2s steps(5);text-transform:uppercase}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Toggle */
.sidebar-toggle{display:none;width:38px;height:38px;align-items:center;justify-content:center;background:var(--bg);border:3px solid var(--border2);cursor:pointer;font-size:18px;color:var(--text);font-family:var(--mono);font-weight:900}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:52px;bottom:0;z-index:40;transform:translateX(-100%)}
  .sidebar.open-mobile{transform:translateX(0)}
  .sidebar-toggle{display:flex}
  .home{padding:14px 14px 32px}
  .day-inner{padding:0 14px 32px}
  .day-meta{font-size:24px}
  .stat-blocks{grid-template-columns:1fr 1fr}
  .stat-blk:last-child{grid-column:span 2;border-top:3px solid var(--border2);border-right:none}
  .tb-center{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
@media print{.topbar,.sidebar,.progress-wrap,.toast,.overlay,.btn{display:none!important}body{background:#fff!important;color:#000!important;overflow:visible;height:auto}.prompt-body{border:2px solid #000;background:#fff}}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-l">
    <div class="tb-logo">∑</div>
    <span class="tb-title">量化学习计划追踪</span>
    <button class="sidebar-toggle" onclick="toggleSidebar()">≡</button>
  </div>
  <div class="tb-center">
    <button class="tb-track active" data-track="main" onclick="switchTrack('main')">主计划</button>
    <button class="tb-track" data-track="math" onclick="switchTrack('math')">数学</button>
  </div>
  <div class="tb-r">
    <div class="tb-stat">DONE <span class="tb-stat-v" id="tb-done">0/8</span></div>
    <div class="tb-stat">PROG <span class="tb-stat-v" id="tb-pct">0%</span></div>
    <div class="tb-stat">STREAK <span class="tb-stat-v" id="tb-streak">0d</span></div>
  </div>
</header>
<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content">

    <div class="view active" id="view-home">
      <div class="home">
        <div class="stat-blocks" id="stat-blocks"></div>
        <div id="stage-list"></div>
        <div class="legend">
          <span>0</span><span class="legend-sq" style="background:var(--bg3);border-color:var(--border)"></span>
          <span class="legend-sq" style="background:rgba(0,255,65,0.15);border-color:rgba(0,255,65,0.2)"></span>
          <span class="legend-sq" style="background:rgba(0,255,65,0.3);border-color:rgba(0,255,65,0.35)"></span>
          <span class="legend-sq" style="background:rgba(0,255,65,0.55);border-color:rgba(0,255,65,0.6)"></span>
          <span class="legend-sq" style="background:var(--acid);border-color:var(--acid)"></span><span>100%</span>
        </div>
      </div>
    </div>

    <div class="view day-view" id="view-day">
      <div class="day-inner">
        <div class="breadcrumb" id="day-breadcrumb"></div>
        <div class="day-hd">
          <div class="day-label">DAY <span id="day-num"></span></div>
          <h1 class="day-meta" id="day-meta"></h1>
        </div>
        <div class="sync-row"><button class="sync-badge" id="sync-badge" style="display:none"></button></div>
        <p class="day-desc" id="day-desc"></p>
        <div class="prompt-block">
          <div class="prompt-hd"><span class="prompt-label">PROMPT</span><button class="btn copy" id="copy-btn" onclick="copyPrompt()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> COPY</button></div>
          <pre class="prompt-body" id="prompt-body"></pre>
        </div>
        <div class="task-section"><div class="task-section-hd">TASKS</div><div id="task-list"></div></div>
        <div class="day-footer"><span id="footer-status"></span><div class="btn-group"><button class="btn" id="btn-prev" onclick="navDay(-1)">← PREV</button><button class="btn" id="btn-home" onclick="goHome()">HOME</button><button class="btn primary" id="btn-next" onclick="navDay(1)">NEXT →</button></div></div>
      </div>
    </div>

  </main>
</div>

<div class="overlay" id="overlay">
  <div class="ov-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg></div>
  <p class="ov-msg" id="overlay-msg"></p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===== DATA =====
var MAIN_PLAN={name:'主计划',stages:[
  {id:1,name:'阶段一：Python核心概念速览',sections:[
    {name:'程序是怎么运行的',days:[
      {d:1,title:'变量、数据类型、输入输出',desc:'变量不是「存储数据」，而是「给数据贴标签」。今天不背语法——让AI生成代码，你逐行理解每一行在做什么。',prompt:'=== DAY 1：变量、数据类型与输入输出 ===\n\n【学习时长】约3小时\n\n【学习目的】建立「变量=给数据贴标签」的核心直觉。\n\n【核心概念】\n- 变量 = 给数据贴标签\n- 基本类型：int/float/str/bool\n- print()输出 / input()输入\n\n【练习任务】\n- 让AI写一个程序，你能解释每一行\n- 修改变量值观察输出变化\n- 用自己的话总结四个概念',tasks:['让AI生成代码，逐行理解变量/类型/输入/输出','修改变量值观察输出变化','用自己的话总结四个概念各自的作用']},
      {d:2,title:'控制流——判断与循环',desc:'if让程序做决策，for/while让程序重复劳动。今天不记精确语法——让AI生成含条件判断和循环的代码，你能口述执行流程。',prompt:'=== DAY 2：控制流——判断与循环 ===\n\n【学习时长】约3小时\n\n【学习目的】建立「程序可以自己做决策」和「批量处理」两个核心思维。\n\n【核心概念】\n- if/elif/else：条件判断\n- for循环：遍历数据\n- while循环：条件满足就一直做\n\n【练习任务】\n- 让AI生成含if/for/while的代码，口述执行流程\n- 指出分叉点、循环边界、退出条件\n- 修改条件，预测行为，运行验证',tasks:['让AI生成含三种控制流的代码，口述执行流程','指出分叉点、循环边界、退出条件','修改条件，预测行为，运行验证']}

}

function updateDayFooter(globalDay){let plan=getPlan(),done=Store.isDayDone(globalDay),data=Store.load(),dk='d'+globalDay,doneCount=(data[dk]&&data[dk].tasks)?data[dk].tasks.filter(t=>t).length:0,dd=plan.getDay(globalDay),totalTasks=dd?dd.tasks.length:3,el=document.getElementById('footer-status');if(done){el.textContent='DAY '+globalDay+' — COMPLETE ✓';el.style.color='var(--acid)'}else{el.textContent='TASKS: '+doneCount+'/'+totalTasks;el.style.color=''}}
function updateStats(){let plan=getPlan(),done=Store.getDoneCount(),total=currentTrack==='math'?MATH_TRACK.allDays().length:plan.totalDays,pct=total>0?Math.round(done/total*100):0,streak=Store.getStreak();document.getElementById('tb-done').textContent=done+'/'+total;document.getElementById('tb-pct').textContent=pct+'%';document.getElementById('tb-streak').textContent=streak+'d';document.getElementById('progress-bar').style.width=pct+'%';document.querySelectorAll('.tb-track').forEach(t=>t.classList.toggle('active',t.getAttribute('data-track')===currentTrack));let sb=document.getElementById('stat-blocks');if(sb)sb.innerHTML='<div class="stat-blk"><div class="stat-blk-label">DONE</div><div class="stat-blk-val">'+done+'/'+total+'</div></div><div class="stat-blk"><div class="stat-blk-label">PROGRESS</div><div class="stat-blk-val">'+pct+'%</div></div><div class="stat-blk"><div class="stat-blk-label">STREAK</div><div class="stat-blk-val">'+streak+'</div><div class="stat-blk-sub">DAYS</div></div>'}
function checkOverlay(){let total=currentTrack==='math'?MATH_TRACK.allDays().length:MAIN_PLAN.totalDays,allDone=true;if(currentTrack==='math'){MATH_TRACK.allDays().forEach(day=>{if(!Store.isDayDone(day.d))allDone=false})}else{for(let i=1;i<=total;i++){if(!Store.isDayDone(i)){allDone=false;break}}}let ov=document.getElementById('overlay');if(allDone&&total>0){ov.classList.add('show');document.getElementById('overlay-msg').textContent=(currentTrack==='math'?'MATH TRACK':'MAIN PLAN')+' COMPLETE! ✓'}else{ov.classList.remove('show')}}

function goHome(){document.getElementById('view-day').classList.remove('active');document.getElementById('view-home').classList.add('active');document.getElementById('overlay').classList.remove('show');currentDay=null;renderAll()}
function goDay(d){currentDay=d;renderDay(d);renderSidebar();updateStats()}
function navDay(dir){let plan=getPlan(),next=dir>0?(currentTrack==='math'?MATH_TRACK.getNextDay(currentDay):plan.getNextDay(currentDay)):(currentTrack==='math'?MATH_TRACK.getPrevDay(currentDay):plan.getPrevDay(currentDay));if(next)goDay(next)}
function switchTrack(track){if(track===currentTrack)return;currentTrack=track;goHome()}
function switchTrackUI(){updateStats()}
var _toastTimer=null;
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(_toastTimer)clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function copyPrompt(){let text=document.getElementById('prompt-body').textContent;navigator.clipboard.writeText(text).then(()=>{let btn=document.getElementById('copy-btn');btn.classList.add('copied');btn.innerHTML='COPIED ✓';showToast('COPIED TO CLIPBOARD');setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> COPY'},2000)}).catch(()=>showToast('COPY FAILED'))}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open-mobile')}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();let dayData=getPlan().getDay(currentDay);if(dayData){for(let i=0;i<dayData.tasks.length;i++){if(!Store.isTaskDone(currentDay,i)){document.querySelectorAll('#task-list .task-item')[i]?.click();break}}}}if(e.key==='Escape')goHome()});
document.addEventListener('DOMContentLoaded',function(){renderAll();goDay(1)});
</script>
</body>
</html>
