<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Premium Dark · 学习计划追踪器</title>
<style>
/* ================================================================
   Luxury Premium Dark — 黑金+衬线+烫金质感
   参考: cip-style-guide.md §Luxury Premium
   特征: #1C1917底色 · #D4AF37金色 · Playfair衬线 · 精致间距 · 暗金渐变
   ================================================================ */
:root {
  --bg:#0d0b0a;--bg2:#1a1715;--bg3:#25211e;--border:#2e2924;--border2:#3d3630;
  --text:#e8e0d5;--text2:#9c9285;--text3:#5e5650;
  --gold:#d4af37;--gold2:#c9a632;--gold-light:#f0d060;--gold-dim:rgba(212,175,55,0.12);
  --rose:rgba(180,130,110,0.3);
  --c0:var(--bg2);--c1:rgba(212,175,55,0.1);--c2:rgba(212,175,55,0.25);--c3:rgba(212,175,55,0.5);--c4:var(--gold);
  --font:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Playfair Display","Noto Serif SC",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono","Fira Code",ui-monospace,Consolas,monospace;
  --r-sm:4px;--r-md:6px;--r-lg:8px;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:14px;line-height:1.7;background:var(--bg);color:var(--text)}
/* Subtle gold grain */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 30% 20%,rgba(212,175,55,0.04) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(180,130,110,0.03) 0%,transparent 50%)}

.topbar{display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 24px;flex-shrink:0;position:relative;z-index:50;background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);border-bottom:1px solid var(--border)}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-logo{width:28px;height:28px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;color:var(--gold);font-weight:700;border-radius:2px}
.tb-title{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--text);letter-spacing:0.02em}

.tb-center{display:flex;border:1px solid var(--border2);border-radius:var(--r-sm);overflow:hidden;background:var(--bg2)}
.tb-track{padding:6px 20px;font-size:11px;font-weight:500;font-family:var(--font);border:none;cursor:pointer;background:transparent;color:var(--text2);letter-spacing:0.03em;transition:all .3s var(--ease)}
.tb-track:first-child{border-right:1px solid var(--border)}
.tb-track.active{background:var(--gold-dim);color:var(--gold);font-weight:600}
.tb-track:hover:not(.active){color:var(--text)}

.tb-r{display:flex;align-items:center;gap:20px;font-size:11px;color:var(--text2)}
.tb-stat{display:flex;align-items:center;gap:5px}
.tb-stat-v{font-weight:600;color:var(--gold);font-family:var(--mono);font-size:13px}

.progress-wrap{height:1px;background:var(--border);flex-shrink:0}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,transparent,var(--gold),var(--gold-light));transition:width .6s var(--ease);box-shadow:0 0 6px rgba(212,175,55,0.3)}

.app-layout{display:flex;height:calc(100vh - 50px - 1px);position:relative;z-index:1}

.sidebar{width:210px;flex-shrink:0;overflow-y:auto;padding:8px 0;background:var(--bg2);border-right:1px solid var(--border);transition:transform .25s var(--ease)}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.side-stage{user-select:none;margin-bottom:2px}
.side-stage-hd{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:var(--text2);transition:all .2s var(--ease);font-weight:500}
.side-stage-hd:hover{background:var(--bg3);color:var(--text)}
.side-arrow{font-size:9px;color:var(--gold);transition:transform .2s var(--ease);display:inline-block}
.side-stage.open>.side-stage-hd .side-arrow{transform:rotate(90deg)}
.side-stage-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-stage-n{font-family:var(--mono);font-size:10px;color:var(--text3)}

.side-body{display:none;padding-left:16px}
.side-stage.open>.side-body{display:block}
.side-item{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 18px;font-size:11px;color:var(--text3);cursor:pointer;transition:all .2s var(--ease);border-radius:var(--r-sm);position:relative}
.side-item:hover{background:var(--bg3);color:var(--text2)}
.side-item.active{color:var(--gold);font-weight:600;background:var(--gold-dim)}
.side-dot{display:inline-block;width:5px;height:5px;border-radius:50%;flex-shrink:0}
.side-dot.d0{background:var(--text3)}.side-dot.d1{background:var(--c1)}.side-dot.d2{background:var(--c2)}.side-dot.d3{background:var(--c3)}.side-dot.d4{background:var(--gold)}

.content{flex:1;overflow-y:auto;overflow-x:hidden}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.view{display:none}.view.active{display:block}

.home{padding:24px 28px 40px;max-width:780px;margin:0 auto}

.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.stat-card{background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);border:1px solid var(--border);border-radius:var(--r-md);padding:20px 22px;transition:all .3s var(--ease)}
.stat-card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.stat-label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.stat-val{font-family:var(--serif);font-size:36px;font-weight:700;color:var(--gold);line-height:1}
.stat-sub{font-size:10px;color:var(--text3);margin-top:4px}

.stage-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:14px;transition:all .3s var(--ease)}
.stage-card:hover{border-color:var(--border2)}
.stage-card.open .stage-body{display:block}
.stage-card:not(.open) .stage-body{display:none}

.stage-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;cursor:pointer;user-select:none;transition:background .2s var(--ease)}
.stage-hd:hover{background:var(--bg3)}
.stage-hd-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.stage-arrow{color:var(--gold);font-size:10px;transition:transform .2s var(--ease)}
.stage-card.open .stage-arrow{transform:rotate(90deg)}
.stage-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-meta{font-family:var(--mono);font-size:10px;color:var(--text3)}

.stage-body{padding:12px 18px 18px;border-top:1px solid var(--border)}
.sec-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

.day-grid{display:flex;flex-wrap:wrap;gap:5px;padding:3px 0}
.day-cell{width:20px;height:20px;border-radius:3px;cursor:pointer;flex-shrink:0;transition:all .15s var(--ease);position:relative;border:1px solid transparent}
.day-cell:hover{outline:2px solid var(--gold);outline-offset:3px;z-index:2;transform:scale(1.15)}
.day-cell:active{transform:scale(0.85)}
.day-cell[data-lv="0"]{background:var(--bg3);border-color:var(--border)}
.day-cell[data-lv="1"]{background:rgba(212,175,55,0.08);border-color:rgba(212,175,55,0.1)}
.day-cell[data-lv="2"]{background:rgba(212,175,55,0.18);border-color:rgba(212,175,55,0.2)}
.day-cell[data-lv="3"]{background:rgba(212,175,55,0.35);border-color:rgba(212,175,55,0.4)}
.day-cell[data-lv="4"]{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px rgba(212,175,55,0.2)}

.cell-tip{position:absolute;bottom:calc(100%+8px);left:50%;transform:translateX(-50%);padding:5px 12px;background:var(--bg3);color:var(--gold);font-size:10px;border-radius:4px;border:1px solid var(--border2);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:20;font-family:var(--font)}
.cell-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--border2)}
.day-cell:hover .cell-tip{opacity:1}

.legend{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 0 0;font-size:10px;color:var(--text3)}

.day-view{padding:0}
.day-inner{max-width:680px;margin:0 auto;padding:0 24px 40px}

.breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text3)}
.breadcrumb .cur{color:var(--gold);font-weight:600}

.day-hd{padding:18px 0 4px}
.day-label{font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.day-meta{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.3;color:var(--text);letter-spacing:0.01em}

.sync-row{padding:10px 0}
.sync-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;font-size:11px;font-weight:500;font-family:var(--font);background:var(--gold-dim);color:var(--gold);border:1px solid rgba(212,175,55,0.2);border-radius:var(--r-sm);cursor:pointer;transition:all .3s var(--ease)}
.sync-badge:hover{background:rgba(212,175,55,0.18);transform:translateY(-1px)}

.day-desc{padding:6px 0 16px;font-size:14px;line-height:1.9;color:var(--text2);border-bottom:1px solid var(--border)}

.prompt-card{margin-top:18px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
.prompt-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--bg3);border-bottom:1px solid var(--border)}
.prompt-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.prompt-label::before{content:'';width:6px;height:6px;background:var(--gold);border-radius:1px}
.prompt-body{padding:18px;font-size:12.5px;line-height:1.9;color:var(--text2);white-space:pre-wrap;word-break:break-word;font-family:var(--font);max-height:400px;overflow-y:auto}
.prompt-body::-webkit-scrollbar{width:4px}.prompt-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.task-section{margin-top:18px}
.task-section-hd{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;padding:0 4px}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;border-radius:var(--r-sm);cursor:pointer;transition:all .2s var(--ease);border:1px solid transparent}
.task-item:hover{background:var(--bg2);border-color:var(--border)}
.task-chk{width:20px;height:20px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;transition:all .2s var(--ease)}
.task-item:hover .task-chk{border-color:var(--gold)}
.task-item.done .task-chk{background:var(--gold);border-color:var(--gold)}
.task-chk svg{opacity:0}.task-item.done .task-chk svg{opacity:1}
.task-txt{font-size:13px;color:var(--text);flex:1;line-height:1.7;transition:all .2s var(--ease)}
.task-item.done .task-txt{text-decoration:line-through;color:var(--text3)}
.task-item.done{opacity:.5}

.day-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text3)}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;font-size:11px;font-weight:500;font-family:var(--font);border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .3s var(--ease)}
.btn:hover{background:var(--bg3);border-color:var(--gold);color:var(--text)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;border-color:transparent;font-weight:600}
.btn.primary:hover{box-shadow:0 4px 16px rgba(212,175,55,0.3)}
.btn.copy.copied{background:rgba(212,175,55,0.15);border-color:var(--gold);color:var(--gold)}
.btn-group{display:flex;gap:6px}

.overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(13,11,10,0.95);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.overlay.show{opacity:1;pointer-events:auto}
.ov-icon{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;background:var(--gold-dim)}
.ov-msg{margin-top:16px;font-family:var(--serif);font-size:20px;font-weight:700;color:var(--gold)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:6px;padding:10px 20px;background:var(--bg2);color:var(--gold);border:1px solid var(--border2);border-radius:var(--r-sm);font-size:12px;font-weight:500;opacity:0;pointer-events:none;z-index:300;box-shadow:0 8px 28px rgba(0,0,0,0.4);transition:all .35s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sidebar-toggle{display:none;width:36px;height:36px;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-sm);cursor:pointer;font-size:16px;color:var(--text2)}

@media(max-width:768px){.sidebar{position:fixed;left:0;top:50px;bottom:0;z-index:40;transform:translateX(-100%)}.sidebar.open-mobile{transform:translateX(0)}.sidebar-toggle{display:flex}.home{padding:14px 14px 32px}.day-inner{padding:0 14px 32px}.day-meta{font-size:22px}.stat-row{grid-template-columns:1fr 1fr}.tb-center{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
@media print{.topbar,.sidebar,.progress-wrap,.toast,.overlay,.btn,body::before{display:none!important}body{background:#fff!important;color:#000!important;overflow:visible;height:auto}}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-l"><div class="tb-logo">Σ</div><span class="tb-title">量化学习计划追踪</span><button class="sidebar-toggle" onclick="toggleSidebar()">☰</button></div>
  <div class="tb-center"><button class="tb-track active" data-track="main" onclick="switchTrack('main')">主计划</button><button class="tb-track" data-track="math" onclick="switchTrack('math')">数学</button></div>
  <div class="tb-r"><div class="tb-stat">完成 <span class="tb-stat-v" id="tb-done">0/8</span></div><div class="tb-stat">进度 <span class="tb-stat-v" id="tb-pct">0%</span></div><div class="tb-stat">连续 <span class="tb-stat-v" id="tb-streak">0d</span></div></div>
</header>
<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content">
    <div class="view active" id="view-home"><div class="home"><div class="stat-row" id="stat-row"></div><div id="stage-list"></div><div class="legend"><span>未开始</span><span style="display:inline-block;width:10px;height:10px;background:var(--bg3);border:1px solid var(--border);border-radius:2px;margin:0 3px"></span><span style="display:inline-block;width:10px;height:10px;background:rgba(212,175,55,0.08);border-radius:2px;margin:0 3px"></span><span style="display:inline-block;width:10px;height:10px;background:rgba(212,175,55,0.18);border-radius:2px;margin:0 3px"></span><span style="display:inline-block;width:10px;height:10px;background:rgba(212,175,55,0.35);border-radius:2px;margin:0 3px"></span><span style="display:inline-block;width:10px;height:10px;background:var(--gold);border-radius:2px;margin:0 3px"></span><span>完成</span></div></div></div>
    <div class="view day-view" id="view-day"><div class="day-inner"><div class="breadcrumb" id="day-breadcrumb"></div><div class="day-hd"><div class="day-label">Day <span id="day-num"></span></div><h1 class="day-meta" id="day-meta"></h1></div><div class="sync-row"><button class="sync-badge" id="sync-badge" style="display:none"></button></div><p class="day-desc" id="day-desc"></p><div class="prompt-card"><div class="prompt-hd"><span class="prompt-label">Prompt</span><button class="btn copy" id="copy-btn" onclick="copyPrompt()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button></div><pre class="prompt-body" id="prompt-body"></pre></div><div class="task-section"><div class="task-section-hd">练习任务</div><div id="task-list"></div></div><div class="day-footer"><span id="footer-status"></span><div class="btn-group"><button class="btn" id="btn-prev" onclick="navDay(-1)">← Prev</button><button class="btn" id="btn-home" onclick="goHome()">Home</button><button class="btn primary" id="btn-next" onclick="navDay(1)">Next →</button></div></div></div></div>
  </main>
</div>
<div class="overlay" id="overlay"><div class="ov-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div><p class="ov-msg" id="overlay-msg"></p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===== DATA =====
var MAIN_PLAN={name:'主计划',stages:[{id:1,name:'阶段一：Python核心概念速览',sections:[{name:'程序是怎么运行的',days:[{d:1,title:'变量、数据类型、输入输出',desc:'变量不是「存储数据」，而是「给数据贴标签」。今天不背语法——让AI生成代码，你逐行理解每一行在做什么。',prompt:'=== 第1天：变量、数据类型与输入输出 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n建立「变量=给数据贴标签」的核心直觉。\n\n【核心概念】\n- 变量 = 给数据贴标签\n- 基本类型：int/float/str/bool\n- print() 输出 / input() 输入\n\n【练习任务】\n- 让AI写一个程序，你能解释每一行\n- 修改变量值观察输出变化\n- 用自己的话总结四个概念',tasks:['让AI生成代码，逐行理解变量/类型/输入/输出','修改变量值观察输出变化','用自己的话总结四个概念各自的作用']},{d:2,title:'控制流——判断与循环',desc:'if让程序做决策，for/while让程序重复劳动。今天不记精确语法——让AI生成含条件判断和循环的代码，你能口述执行流程。',prompt:'=== 第2天：控制流——判断与循环 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n建立「程序可以自己做决策」和「批量处理」两个核心思维。\n\n【核心概念】\n- if/elif/else：条件判断\n- for循环：遍历数据\n- while循环：条件满足就一直做\n\n【练习任务】\n- 让AI生成含if/for/while的代码，口述执行流程\n- 指出分叉点、循环边界、退出条件\n- 修改条件，预测行为，运行验证',tasks:['让AI生成含三种控制流的代码，口述执行流程','指出分叉点、循环边界、退出条件','修改条件，预测行为，运行验证']}]},{name:'数据结构概念',days:[{d:3,title:'列表与字典——数据的容器',desc:'列表=有序集合，字典=键值对映射。',prompt:'=== 第3天：列表与字典 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n建立「数据容器」的思维模型。\n\n【核心概念】\n- 列表 = 有序集合\n- 字典 = 键值映射\n- 列表嵌套字典是实战中最常见的数据格式\n\n【练习任务】\n- 定义一个股票字典列表，让AI提取字段\n- 描述过滤需求→AI写代码→你验证\n- 故意模糊描述，观察AI理解偏差',tasks:['定义股票字典列表，让AI提取字段，你验证','描述过滤需求→AI写代码→你验证输出','故意模糊描述，观察AI的理解偏差']}]}]},{id:2,name:'阶段二：数据处理入门',sections:[{name:'文件与数据读写',days:[{d:4,title:'文件读写基础——open/read/write',desc:'程序只有能读取外部数据才算真正有用。',prompt:'=== 第4天：文件读写基础 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n掌握Python文件读写的基本操作。\n\n【核心概念】\n- open()/read()/write()\n- with语句自动关闭文件\n\n【练习任务】\n- 创建文本文件，写入10行数据\n- 读取并统计行数和字数\n- 用with语句改写',tasks:['创建文本文件，写入10行数据','读取文件内容，统计行数和字数','用with语句改写']},{d:5,title:'CSV与JSON——结构化数据格式',desc:'现实世界的数据很少是纯文本——CSV是表格，JSON是嵌套结构。',prompt:'=== 第5天：CSV与JSON ===\n\n【每日学习时长】约2.5小时\n\n【学习目的】\n掌握CSV和JSON两种结构化数据格式。\n\n【核心概念】\n- CSV = 逗号分隔的表格\n- JSON = 键值对嵌套\n\n【练习任务】\n- 用csv.DictReader读取CSV\n- json.dumps序列化字典列表\n- CSV→JSON转换函数',tasks:['用csv.DictReader读取CSV','json.dumps序列化字典列表','写CSV→JSON转换函数']}]},{name:'数据分析基础',days:[{d:6,title:'数据清洗——缺失值与异常值',desc:'真实数据从来都不干净。',prompt:'=== 第6天：数据清洗 ===\n\n【每日学习时长】约2.5小时\n\n【学习目的】\n学会识别和处理数据集的常见问题。\n\n【核心概念】\n- 缺失值识别与处理\n- 异常值检测（IQR）\n\n【练习任务】\n- 统计缺失比例\n- 中位数填充缺失值\n- IQR检测异常值',tasks:['统计缺失比例','中位数填充缺失值','IQR检测异常值并标记']},{d:7,title:'数据可视化——matplotlib入门',desc:'一张好图胜过千行数据。',prompt:'=== 第7天：数据可视化 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n用matplotlib创建基本的统计图表。\n\n【核心概念】\n- plt.plot()/bar()/scatter()\n\n【练习任务】\n- 折线图展示趋势\n- 分组柱状图比较\n- 散点图观察关系',tasks:['画折线图展示趋势','画分组柱状图比较','画散点图观察关系']},{d:8,title:'数据分析报告——从数据到结论',desc:'分析的终点不是图表，而是结论。',prompt:'=== 第8天：数据分析报告 ===\n\n【每日学习时长】约3小时\n\n【学习目的】\n综合运用数据技能，产出分析报告。\n\n【练习任务】\n- 选择数据集提3个问题\n- 清洗+分析+可视化\n- 写结论',tasks:['选择数据集提出3个问题','清洗、分析、可视化','写数据分析结论']}]}]}],_map:null,totalDays:8,getDay(n){if(!this._map){this._map={};this.stages.forEach(s=>{s.sections.forEach(sec=>{sec.days.forEach(d=>{this._map[d.d]={...d,stageName:s.name,sectionName:sec.name}})})})}return this._map[n]||null},getPrevDay(n){for(let i=n-1;i>=1;i--)if(this.getDay(i))return i;return null},getNextDay(n){for(let i=n+1;i<=this.totalDays;i++)if(this.getDay(i))return i;return null}};
var MATH_TRACK={name:'数学',modules:[{id:1,name:'数学思维基础',subtitle:'',days:[{d:1,sync:39,title:'函数思维——从Python函数到数学函数',desc:'建立「函数 = 确定的映射规则」这一核心直觉。',prompt:'=== Math Day 1：函数思维 ===\n\n【每日学习时长】约25分钟\n\n【学习目的】\n建立「函数 = 确定的映射规则」的核心直觉。\n\n【练习任务】\n- 定义 f(x)=2x+1，画折线图\n- 定义 f(x)=x² 和 g(x)=sin(x)\n- 描述三种函数形状差异',tasks:['定义 f(x)=2x+1，生成输出，画折线图','定义 f(x)=x² 和 g(x)=sin(x)，各画一张图','描述三种函数的形状差异']},{d:2,sync:40,title:'坐标与图形——用眼睛理解关系',desc:'学会用笛卡尔坐标系把数字关系画出来。',prompt:'=== Math Day 2：坐标与图形 ===\n\n【每日学习时长】约25分钟\n\n【学习目的】\n用笛卡尔坐标系把数字关系画出来。\n\n【练习任务】\n- matplotlib画折线图\n- 三条线不同颜色\n- 解释趋势',tasks:['用matplotlib画 f(x)=2x+1 折线图','同一张图画三条线','解释每条线的趋势']},{d:3,sync:41,title:'变化率——斜率的直觉',desc:'斜率 = 变化率 =「x每增加1，y变化多少」。',prompt:'=== Math Day 3：变化率——斜率的直觉 ===\n\n【每日学习时长】约25分钟\n\n【学习目的】\n建立「斜率=变化率」的直觉。\n\n【练习任务】\n- 计算斜率\n- 比较不同斜率直线\n- 解释生活含义',tasks:['计算 f(x)=2x+1 的斜率','比较三条不同斜率的直线','解释变化率含义']}]},{id:3,name:'模块三：线性代数基础',subtitle:'',days:[{d:24,sync:null,title:'向量是什么——有方向的量',desc:'在AI中，768维Embedding也是向量。',prompt:'=== Math Day 24：向量是什么 ===\n\n【每日学习时长】约25分钟\n\n【学习目的】\n建立「向量=有大小、有方向的量」的直觉。\n\n【练习任务】\n- 画出二维向量\n- 理解Embedding\n- 解释方向和大小',tasks:['画出二维向量，标注分量','理解Embedding也是向量','解释方向和大小']},{d:27,sync:42,title:'向量点积——相似度的数学根源',desc:'ChromaDB/RAG检索的数学基础——两个Embedding向量的夹角越小，语义越接近。',prompt:'=== Math Day 27：向量点积——相似度的数学根源 ===\n\n【每日学习时长】约25分钟\n\n【与主计划的关联】Main Day 42：Embedding向量检索。\nChromaDB内部在做余弦相似度计算。\n今天让你看清楚那一行代码背后发生了什么。\n\n【学习目的】\n建立「点积 = 方向一致性度量」的直觉。\n余弦相似度∈[-1,+1]是向量检索的数学引擎。\n\n【学习标准】\n- 口述点积公式及几何含义\n- 写代码计算余弦相似度\n- 解释余弦vs欧氏距离\n\n【核心概念】\n- 点积 v·w = |v||w|cos(θ)\n- θ=0°→cos=1→点积最大\n- θ=90°→cos=0→点积为0\n- θ=180°→cos=-1→负值\n- 余弦相似度 = (v·w)/(|v|×|w|) ∈[-1,+1]\n\n【练习任务】\n- v1=[1,2],v2=[2,4],v3=[-2,1]，手算点积\n- 写cosine_sim()函数验证\n- 画图解释夹角对应余弦值\n- 思考：0.95 vs 0.02各说明什么？',tasks:['手算 v1·v2 和 v1·v3','写 cosine_sim() 函数','画图解释夹角对应余弦值']}]}],_map:null,totalDays:5,getDay(n){if(!this._map){this._map={};this.modules.forEach(m=>{m.days.forEach(d=>{this._map[d.d]={...d,moduleName:m.name}})})}return this._map[n]||null},allDays(){let a=[];this.modules.forEach(m=>{m.days.forEach(d=>a.push(d))});return a.sort((x,y)=>x.d-y.d)},getPrevDay(n){let all=this.allDays().map(d=>d.d);let idx=all.indexOf(n);return idx>0?all[idx-1]:null},getNextDay(n){let all=this.allDays().map(d=>d.d);let idx=all.indexOf(n);return idx<all.length-1?all[idx+1]:null}};
// ===== STATE & STORE =====
var currentTrack='main',currentDay=1,KEY_MAIN='lp_main',KEY_MATH='lp_math';
var Store={key(){return currentTrack==='math'?KEY_MATH:KEY_MAIN},load(){try{return JSON.parse(localStorage.getItem(this.key()))||{}}catch(e){return{}}},save(d){localStorage.setItem(this.key(),JSON.stringify(d))},toggleTask(day,idx){let d=this.load(),dk='d'+day;if(!d[dk])d[dk]={tasks:[false,false,false]};d[dk].tasks[idx]=!d[dk].tasks[idx];this.save(d)},isTaskDone(day,idx){let d=this.load(),dk='d'+day;return!!(d[dk]&&d[dk].tasks&&d[dk].tasks[idx])},isDayDone(day){let d=this.load(),dk='d'+day;return!!(d[dk]&&d[dk].tasks&&d[dk].tasks.every(t=>t))},getLevel(day){let d=this.load(),dk='d'+day;if(!d[dk]||!d[dk].tasks)return 0;let done=d[dk].tasks.filter(t=>t).length;if(done===3)return 4;if(done===2)return 3;if(done===1)return 2;return 1},getDoneCount(){let c=0;if(currentTrack==='math'){MATH_TRACK.allDays().forEach(day=>{if(this.isDayDone(day.d))c++})}else{for(let i=1;i<=MAIN_PLAN.totalDays;i++){if(this.isDayDone(i))c++}}return c},getStreak(){let doneCount=this.getDoneCount(),prefix=currentTrack==='math'?'lp_ms':'lp_ms2';function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}let today=new Date(),ss=localStorage.getItem('ss_'+prefix),baseline=parseInt(localStorage.getItem('bl_'+prefix))||0;if(!ss){if(doneCount>0){let defS=4,sd=new Date(today.getFullYear(),today.getMonth(),today.getDate()-defS+1);ss=fmt(sd);baseline=Math.max(0,doneCount-defS)}else{ss=fmt(today);baseline=0}localStorage.setItem('ss_'+prefix,ss);localStorage.setItem('bl_'+prefix,String(baseline))}let tOnly=new Date(today.getFullYear(),today.getMonth(),today.getDate()),p=ss.split('-'),sOnly=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])),daysSince=Math.floor((tOnly-sOnly)/86400000)+1,newlyDone=doneCount-baseline;if(newlyDone>=daysSince-1)return Math.min(newlyDone,daysSince);return 0}};
// ===== RENDER =====
function getPlan(){return currentTrack==='math'?MATH_TRACK:MAIN_PLAN}
function renderAll(){renderHome();renderSidebar();updateStats()}
function renderHome(){let plan=getPlan(),stageList=document.getElementById('stage-list');stageList.innerHTML='';if(currentTrack==='math'){MATH_TRACK.modules.forEach(mod=>{let card=document.createElement('div');card.className='stage-card open';let hd=document.createElement('div');hd.className='stage-hd';hd.innerHTML='<div class="stage-hd-l"><span class="stage-arrow">▶</span><span class="stage-name">'+mod.name+'</span></div><span class="stage-meta">'+mod.days.length+'天</span>';hd.addEventListener('click',()=>card.classList.toggle('open'));card.appendChild(hd);let body=document.createElement('div');body.className='stage-body';let grid=document.createElement('div');grid.className='day-grid';mod.days.forEach(day=>{let cell=document.createElement('div');cell.className='day-cell';cell.setAttribute('data-lv',Store.getLevel(day.d));let tip=document.createElement('span');tip.className='cell-tip';tip.textContent='M'+day.d+': '+day.title;cell.appendChild(tip);cell.addEventListener('click',()=>goDay(day.d));grid.appendChild(cell)});body.appendChild(grid);card.appendChild(body);stageList.appendChild(card)})}else{MAIN_PLAN.stages.forEach(stage=>{let card=document.createElement('div');card.className='stage-card open';let hd=document.createElement('div');hd.className='stage-hd';hd.innerHTML='<div class="stage-hd-l"><span class="stage-arrow">▶</span><span class="stage-name">'+stage.name+'</span></div>';hd.addEventListener('click',()=>card.classList.toggle('open'));card.appendChild(hd);let body=document.createElement('div');body.className='stage-body';stage.sections.forEach(sec=>{let st=document.createElement('div');st.className='sec-title';st.textContent=sec.name;body.appendChild(st);let grid=document.createElement('div');grid.className='day-grid';sec.days.forEach(day=>{let cell=document.createElement('div');cell.className='day-cell';cell.setAttribute('data-lv',Store.getLevel(day.d));let tip=document.createElement('span');tip.className='cell-tip';tip.textContent='Day '+day.d+': '+day.title;cell.appendChild(tip);cell.addEventListener('click',()=>goDay(day.d));grid.appendChild(cell)});body.appendChild(grid)});card.appendChild(body);stageList.appendChild(card)})}}
function renderSidebar(){let sb=document.getElementById('sidebar');sb.innerHTML='';if(currentTrack==='math'){MATH_TRACK.modules.forEach(mod=>{let wrap=document.createElement('div');wrap.className='side-stage open';let hd=document.createElement('div');hd.className='side-stage-hd';hd.innerHTML='<span class="side-arrow">▶</span><span class="side-stage-name">'+mod.name+'</span><span class="side-stage-n">'+mod.days.length+'d</span>';hd.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open')});wrap.appendChild(hd);let bd=document.createElement('div');bd.className='side-body';mod.days.forEach(day=>{let item=document.createElement('div');item.className='side-item';let lv=Store.getLevel(day.d);item.innerHTML='<span class="side-dot d'+lv+'"></span>M'+day.d+': '+day.title;if(currentDay===day.d)item.classList.add('active');item.addEventListener('click',e=>{e.stopPropagation();goDay(day.d)});bd.appendChild(item)});wrap.appendChild(bd);sb.appendChild(wrap)})}else{MAIN_PLAN.stages.forEach(stage=>{let wrap=document.createElement('div');wrap.className='side-stage open';let hd=document.createElement('div');hd.className='side-stage-hd';hd.innerHTML='<span class="side-arrow">▶</span><span class="side-stage-name">'+stage.name+'</span>';hd.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open')});wrap.appendChild(hd);let bd=document.createElement('div');bd.className='side-body';stage.sections.forEach(sec=>{sec.days.forEach(day=>{let item=document.createElement('div');item.className='side-item';let lv=Store.getLevel(day.d);item.innerHTML='<span class="side-dot d'+lv+'"></span>Day '+day.d+': '+day.title;if(currentDay===day.d)item.classList.add('active');item.addEventListener('click',e=>{e.stopPropagation();goDay(day.d)});bd.appendChild(item)})});wrap.appendChild(bd);sb.appendChild(wrap)})}}
function renderDay(globalDay){let plan=getPlan(),dayData=plan.getDay(globalDay);if(!dayData){goHome();return}currentDay=globalDay;document.getElementById('day-breadcrumb').innerHTML=currentTrack==='math'?'数学 › '+dayData.moduleName+' › <span class="cur">Day '+globalDay+'</span>':'主计划 › '+dayData.stageName+' › '+dayData.sectionName+' › <span class="cur">Day '+globalDay+'</span>';document.getElementById('day-num').textContent=globalDay;document.getElementById('day-meta').textContent=dayData.title;document.getElementById('day-desc').textContent=dayData.desc;document.getElementById('prompt-body').textContent=dayData.prompt;let sync=document.getElementById('sync-badge');if(currentTrack==='math'&&dayData.sync){sync.style.display='inline-flex';sync.textContent='↗ 同步：Main Day '+dayData.sync;sync.onclick=function(){currentTrack='main';goDay(dayData.sync)}}else{sync.style.display='none'}let tl=document.getElementById('task-list');tl.innerHTML='';dayData.tasks.forEach((task,idx)=>{let label=document.createElement('label');label.className='task-item';if(Store.isTaskDone(globalDay,idx))label.classList.add('done');let chk=document.createElement('div');chk.className='task-chk';chk.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';let txt=document.createElement('span');txt.className='task-txt';txt.textContent=task;label.appendChild(chk);label.appendChild(txt);label.addEventListener('click',function(){Store.toggleTask(globalDay,idx);label.classList.toggle('done');updateDayFooter(globalDay);renderAll();checkOverlay()});tl.appendChild(label)});updateDayFooter(globalDay);checkOverlay();let prevDay=currentTrack==='math'?MATH_TRACK.getPrevDay(globalDay):MAIN_PLAN.getPrevDay(globalDay),nextDay=currentTrack==='math'?MATH_TRACK.getNextDay(globalDay):MAIN_PLAN.getNextDay(globalDay);document.getElementById('btn-prev').style.visibility=prevDay?'visible':'hidden';document.getElementById('btn-next').style.visibility=nextDay?'visible':'hidden';document.getElementById('btn-prev').textContent='← '+(prevDay||'');document.getElementById('btn-next').textContent=(nextDay||'')+' →';document.getElementById('view-home').classList.remove('active');document.getElementById('view-day').classList.add('active');document.getElementById('content').scrollTop=0}
function updateDayFooter(globalDay){let plan=getPlan(),done=Store.isDayDone(globalDay),data=Store.load(),dk='d'+globalDay,doneCount=(data[dk]&&data[dk].tasks)?data[dk].tasks.filter(t=>t).length:0,dd=plan.getDay(globalDay),totalTasks=dd?dd.tasks.length:3,el=document.getElementById('footer-status');if(done){el.textContent='Day '+globalDay+' — COMPLETE ✓';el.style.color='var(--gold)'}else{el.textContent='Tasks: '+doneCount+'/'+totalTasks;el.style.color=''}}
function updateStats(){let plan=getPlan(),done=Store.getDoneCount(),total=currentTrack==='math'?MATH_TRACK.allDays().length:plan.totalDays,pct=total>0?Math.round(done/total*100):0,streak=Store.getStreak();document.getElementById('tb-done').textContent=done+'/'+total;document.getElementById('tb-pct').textContent=pct+'%';document.getElementById('tb-streak').textContent=streak+'d';document.getElementById('progress-bar').style.width=pct+'%';document.querySelectorAll('.tb-track').forEach(t=>t.classList.toggle('active',t.getAttribute('data-track')===currentTrack));let sr=document.getElementById('stat-row');if(sr)sr.innerHTML='<div class="stat-card"><div class="stat-label">已完成</div><div class="stat-val">'+done+'/'+total+'</div></div><div class="stat-card"><div class="stat-label">进度</div><div class="stat-val">'+pct+'%</div></div><div class="stat-card"><div class="stat-label">连续学习</div><div class="stat-val">'+streak+'</div><div class="stat-sub">天</div></div>'}
function checkOverlay(){let total=currentTrack==='math'?MATH_TRACK.allDays().length:MAIN_PLAN.totalDays,allDone=true;if(currentTrack==='math'){MATH_TRACK.allDays().forEach(day=>{if(!Store.isDayDone(day.d))allDone=false})}else{for(let i=1;i<=total;i++){if(!Store.isDayDone(i)){allDone=false;break}}}let ov=document.getElementById('overlay');if(allDone&&total>0){ov.classList.add('show');document.getElementById('overlay-msg').textContent=(currentTrack==='math'?'Math Track':'Main Plan')+' Complete! 🎉'}else{ov.classList.remove('show')}}
function goHome(){document.getElementById('view-day').classList.remove('active');document.getElementById('view-home').classList.add('active');document.getElementById('overlay').classList.remove('show');currentDay=null;renderAll()}
function goDay(d){currentDay=d;renderDay(d);renderSidebar();updateStats()}
function navDay(dir){let plan=getPlan(),next=dir>0?(currentTrack==='math'?MATH_TRACK.getNextDay(currentDay):plan.getNextDay(currentDay)):(currentTrack==='math'?MATH_TRACK.getPrevDay(currentDay):plan.getPrevDay(currentDay));if(next)goDay(next)}
function switchTrack(track){if(track===currentTrack)return;currentTrack=track;goHome()}
var _toastTimer=null;function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(_toastTimer)clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function copyPrompt(){let text=document.getElementById('prompt-body').textContent;navigator.clipboard.writeText(text).then(()=>{let btn=document.getElementById('copy-btn');btn.classList.add('copied');btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!';showToast('Copied to clipboard');setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy'},2000)}).catch(()=>showToast('Copy failed'))}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open-mobile')}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();let dayData=getPlan().getDay(currentDay);if(dayData){for(let i=0;i<dayData.tasks.length;i++){if(!Store.isTaskDone(currentDay,i)){document.querySelectorAll('#task-list .task-item')[i]?.click();break}}}}if(e.key==='Escape')goHome()});
document.addEventListener('DOMContentLoaded',function(){renderAll();goDay(1)});
</script>
</body>
</html>
