<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organic Natural · 学习计划追踪器</title>
<style>
/* ================================================================
   Organic Natural — 大地色+圆润+自然流动+温暖手工感
   参考: canvas-design-system.md §Organic Systems
        cip-style-guide.md §Warm Organic
   特征: #f5f0e8底色 · 大地棕/橄榄绿 · 圆润有机形 · 温暖 · 手工质感
   ================================================================ */
:root {
  --bg:#f5f0e8;--card:#fdfbf6;--card2:#f8f3ea;--border:#e0d8c8;--border2:#d4cbb8;
  --text:#2d2418;--text2:#6e5e48;--text3:#a09078;
  --brown:#8b5e3c;--olive:#6b8e4e;--terracotta:#c1784c;--sand:#e8d5b0;--cream:#faf5ec;
  --c0:#e8dfd0;--c1:#d4c8a8;--c2:#b8a878;--c3:#9e8a5a;--c4:#8b5e3c;
  --font:"Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:"Noto Serif SC",Georgia,"Times New Roman",serif;
  --r-sm:10px;--r-md:14px;--r-lg:20px;--r-full:9999px;
  --shadow:0 2px 8px rgba(0,0,0,0.04),0 1px 3px rgba(0,0,0,0.03);
  --ease:cubic-bezier(0.25,1,0.5,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:15px;line-height:1.7;background:var(--bg);color:var(--text)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 50%,rgba(139,94,60,0.04),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(107,142,78,0.04),transparent 50%);opacity:0.6}

.topbar{display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 20px;flex-shrink:0;position:relative;z-index:50;background:rgba(253,251,246,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.tb-l{display:flex;align-items:center;gap:10px}
.tb-logo{font-size:22px}
.tb-title{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--text)}
.tb-badge{font-size:10px;font-weight:600;padding:3px 10px;border-radius:var(--r-full);background:rgba(139,94,60,0.08);color:var(--brown)}

.tb-center{display:flex;border:1px solid var(--border);border-radius:var(--r-full);overflow:hidden;background:var(--card)}
.tb-track{padding:6px 20px;font-size:12px;font-weight:500;font-family:var(--font);border:none;cursor:pointer;background:transparent;color:var(--text2);transition:all .25s var(--ease)}
.tb-track.active{background:var(--brown);color:#fff}
.tb-track:hover:not(.active){color:var(--brown);background:rgba(139,94,60,0.04)}

.tb-r{display:flex;align-items:center;gap:16px;font-size:11px;color:var(--text2)}
.tb-stat{display:flex;align-items:center;gap:4px}
.tb-stat-v{font-weight:700;color:var(--brown);font-size:13px}

.progress-wrap{height:3px;background:var(--border);flex-shrink:0}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--brown),var(--olive));border-radius:0 3px 3px 0;transition:width .5s var(--ease)}

.app-layout{display:flex;height:calc(100vh - 50px - 3px);position:relative;z-index:1}

.sidebar{width:210px;flex-shrink:0;overflow-y:auto;padding:8px 0;background:var(--card2);border-right:1px solid var(--border);transition:transform .3s var(--ease)}
.sidebar::-webkit-scrollbar{width:5px}.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}

.side-stage{user-select:none}
.side-stage-hd{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);transition:all .2s var(--ease);border-radius:var(--r-sm);margin:1px 6px}
.side-stage-hd:hover{background:var(--card);color:var(--brown)}
.side-arrow{font-size:9px;color:var(--brown);transition:transform .2s var(--ease);display:inline-block}
.side-stage.open>.side-stage-hd .side-arrow{transform:rotate(90deg)}
.side-stage-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-stage-n{font-size:10px;color:var(--text3)}

.side-body{display:none;padding-left:10px}
.side-stage.open>.side-body{display:block}
.side-item{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 18px;font-size:11px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:var(--r-sm);transition:all .2s var(--ease);margin:1px 6px}
.side-item:hover{background:var(--card);color:var(--text2)}
.side-item.active{background:rgba(139,94,60,0.06);color:var(--brown);font-weight:600}
.side-item.active::before{content:'·';font-weight:700;margin-right:-4px}
.side-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.side-dot.d0{background:var(--border)}.side-dot.d1{background:var(--c1)}.side-dot.d2{background:var(--c2)}.side-dot.d3{background:var(--c3)}.side-dot.d4{background:var(--brown)}

.content{flex:1;overflow-y:auto;overflow-x:hidden}
.content::-webkit-scrollbar{width:5px}.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}
.view{display:none}.view.active{display:block}

.home{padding:22px 24px 40px;max-width:780px;margin:0 auto}

.stats-strip{display:flex;justify-content:center;gap:32px;padding:8px 0 20px;border-bottom:1px solid var(--border);margin-bottom:18px;font-size:12px;color:var(--text2)}
.stat-num{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--brown)}

.stage-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);transition:all .3s var(--ease)}
.stage-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.stage-card.open .stage-body{display:block}
.stage-card:not(.open) .stage-body{display:none}
.stage-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;cursor:pointer;user-select:none;transition:background .2s var(--ease)}
.stage-hd:hover{background:var(--card2)}
.stage-hd-l{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.stage-arrow{font-size:10px;color:var(--brown);transition:transform .2s var(--ease)}
.stage-card.open .stage-arrow{transform:rotate(90deg)}
.stage-name{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-meta{font-size:10px;color:var(--text3)}

.stage-body{padding:12px 18px 18px;border-top:1px solid var(--border)}
.sec-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 8px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:2px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

.day-grid{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0}
.day-cell{width:22px;height:22px;border-radius:50%;cursor:pointer;flex-shrink:0;transition:all .2s var(--ease);position:relative}
.day-cell:hover{transform:scale(1.2);z-index:2;box-shadow:0 3px 12px rgba(0,0,0,0.1)}
.day-cell:active{transform:scale(0.9)}
.day-cell[data-lv="0"]{background:var(--c0);border:1px solid var(--border)}
.day-cell[data-lv="1"]{background:var(--c1);border:1px solid var(--border2)}
.day-cell[data-lv="2"]{background:var(--c2)}
.day-cell[data-lv="3"]{background:var(--c3)}
.day-cell[data-lv="4"]{background:var(--brown);box-shadow:0 2px 8px rgba(139,94,60,0.2)}

.cell-tip{position:absolute;bottom:calc(100%+8px);left:50%;transform:translateX(-50%);padding:5px 12px;background:var(--text);color:var(--cream);font-size:11px;border-radius:var(--r-full);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:20}
.cell-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--text)}
.day-cell:hover .cell-tip{opacity:1}

.legend{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 0 0;font-size:10px;color:var(--text3)}

.day-view{padding:0}
.day-inner{max-width:680px;margin:0 auto;padding:0 20px 40px}
.breadcrumb{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--border);font-size:12px;color:var(--text3)}
.breadcrumb .cur{color:var(--brown);font-weight:700}

.day-hd{padding:18px 0 0}
.day-label{font-size:10px;font-weight:700;color:var(--brown);text-transform:uppercase;letter-spacing:.08em}
.day-meta{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.3;color:var(--text);margin-top:4px}

.sync-row{padding:10px 0}
.sync-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;font-size:11px;font-weight:600;font-family:var(--font);background:rgba(139,94,60,0.06);color:var(--brown);border:1px solid var(--border);border-radius:var(--r-full);cursor:pointer;transition:all .25s var(--ease)}
.sync-badge:hover{background:rgba(139,94,60,0.12);transform:translateY(-1px)}

.day-desc{padding:6px 0 16px;font-size:14px;line-height:1.85;color:var(--text2);border-bottom:1px solid var(--border)}

.prompt-card{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.prompt-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:var(--card2);border-bottom:1px solid var(--border)}
.prompt-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.prompt-label::before{content:'🌿';font-size:12px}
.prompt-body{padding:18px;font-size:13px;line-height:1.85;color:var(--text2);white-space:pre-wrap;word-break:break-word;font-family:var(--font);max-height:400px;overflow-y:auto}
.prompt-body::-webkit-scrollbar{width:5px}.prompt-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}

.task-section{margin-top:20px}
.task-section-hd{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding:0 4px}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:var(--r-md);cursor:pointer;transition:all .25s var(--ease);border:1px solid transparent;background:var(--card);box-shadow:var(--shadow);margin-bottom:6px}
.task-item:hover{transform:translateX(2px);border-color:var(--border)}
.task-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--card);transition:all .25s var(--ease)}
.task-item:hover .task-chk{border-color:var(--olive)}
.task-item.done .task-chk{background:var(--olive);border-color:var(--olive)}
.task-chk svg{opacity:0}.task-item.done .task-chk svg{opacity:1}
.task-txt{font-size:13.5px;color:var(--text);flex:1;line-height:1.6}
.task-item.done .task-txt{text-decoration:line-through;color:var(--text3)}
.task-item.done{opacity:.55}

.day-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text3)}

.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 18px;font-size:12px;font-weight:500;font-family:var(--font);border:1px solid var(--border);border-radius:var(--r-full);background:var(--card);color:var(--text2);cursor:pointer;transition:all .25s var(--ease)}
.btn:hover{background:var(--card2);border-color:var(--brown);color:var(--brown)}
.btn:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
.btn.primary{background:var(--brown);color:#fff;border-color:var(--brown);box-shadow:0 3px 12px rgba(139,94,60,0.2)}
.btn.primary:hover{background:#7a5235;box-shadow:0 4px 16px rgba(139,94,60,0.3)}
.btn.copy.copied{background:rgba(107,142,78,0.1);border-color:var(--olive);color:var(--olive)}
.btn-group{display:flex;gap:8px}

.overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(245,240,232,0.94);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.overlay.show{opacity:1;pointer-events:auto}
.ov-icon{width:68px;height:68px;border-radius:50%;background:rgba(107,142,78,0.1);border:2.5px solid var(--olive);display:flex;align-items:center;justify-content:center;animation:ov-grow 1.8s var(--ease) infinite}
@keyframes ov-grow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ov-msg{margin-top:16px;font-family:var(--serif);font-size:20px;font-weight:700;color:var(--text)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:8px;padding:10px 22px;background:var(--text);color:var(--cream);border-radius:var(--r-full);font-size:12px;font-weight:500;opacity:0;pointer-events:none;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,0.12);transition:all .35s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sidebar-toggle{display:none;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:16px;color:var(--text2)}

@media(max-width:768px){.sidebar{position:fixed;left:0;top:50px;bottom:0;z-index:40;transform:translateX(-100%)}.sidebar.open-mobile{transform:translateX(0)}.sidebar-toggle{display:flex}.home{padding:14px 14px 32px}.day-inner{padding:0 14px 32px}.day-meta{font-size:23px}.tb-center{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-l"><span class="tb-logo">🌱</span><span class="tb-title">量化学习计划追踪</span><span class="tb-badge" id="tb-badge">主计划</span><button class="sidebar-toggle" onclick="toggleSidebar()">☰</button></div>
  <div class="tb-center"><button class="tb-track active" data-track="main" onclick="switchTrack('main')">主计划</button><button class="tb-track" data-track="math" onclick="switchTrack('math')">数学</button></div>
  <div class="tb-r"><div class="tb-stat">完成 <span class="tb-stat-v" id="tb-done">0/8</span></div><div class="tb-stat">进度 <span class="tb-stat-v" id="tb-pct">0%</span></div><div class="tb-stat">连续 <span class="tb-stat-v" id="tb-streak">0d</span></div></div>
</header>
<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content">
    <div class="view active" id="view-home"><div class="home"><div class="stats-strip" id="stats-strip"></div><div id="stage-list"></div></div></div>
    <div class="view day-view" id="view-day"><div class="day-inner"><div class="breadcrumb" id="day-breadcrumb"></div><div class="day-hd"><div class="day-label">Day <span id="day-num"></span></div><h1 class="day-meta" id="day-meta"></h1></div><div class="sync-row"><button class="sync-badge" id="sync-badge" style="display:none"></button></div><p class="day-desc" id="day-desc"></p><div class="prompt-card"><div class="prompt-hd"><span class="prompt-label">Prompt</span><button class="btn copy" id="copy-btn" onclick="copyPrompt()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button></div><pre class="prompt-body" id="prompt-body"></pre></div><div class="task-section"><div class="task-section-hd">练习任务</div><div id="task-list"></div></div><div class="day-footer"><span id="footer-status"></span><div class="btn-group"><button class="btn" id="btn-prev" onclick="navDay(-1)">← Prev</button><button class="btn" id="btn-home" onclick="goHome()">Home</button><button class="btn primary" id="btn-next" onclick="navDay(1)">Next →</button></div></div></div></div>
  </main>
</div>
<div class="overlay" id="overlay"><div class="ov-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6b8e4e" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div><p class="ov-msg" id="overlay-msg"></p></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var MAIN_PLAN={name:'主计划',stages:[{id:1,name:'阶段一：Python核心概念速览',sections:[{name:'程序是怎么运行的',days:[{d:1,title:'变量、数据类型、输入输出',desc:'变量不是「存储数据」，而是「给数据贴标签」。今天不背语法——让AI生成代码，你逐行理解每一行在做什么。',prompt:'=== 第1天：变量、数据类型与输入输出 ===\n\n【学习时长】约3小时\n【学习目的】建立「变量=给数据贴标签」的直觉。\n【核心概念】\n- 变量/类型/print/input\n【练习任务】\n- 让AI生成代码，逐行理解\n- 修改变量观察变化\n- 用自己话总结概念',tasks:['让AI生成代码，逐行理解','修改变量值观察输出变化','用自己话总结四个概念']},{d:2,title:'控制流——判断与循环',desc:'if让程序做决策，for/while让程序重复劳动。',prompt:'=== 第2天：控制流 ===\n\n【学习时长】约3小时\n【学习目的】程序自主决策+批量处理。\n【核心概念】\n- if/elif/else\n- for/while循环\n【练习任务】\n- 口述执行流程\n- 指出分叉点/循环边界\n- 修改条件验证',tasks:['口述含三种控制流的代码','指出分叉点、循环边界','修改条件，预测行为']}]},{name:'数据结构概念',days:[{d:3,title:'列表与字典——数据的容器',desc:'列表=有序集合，字典=键值对映射。',prompt:'=== 第3天：列表与字典 ===\n\n【学习时长】约3小时\n【学习目的】数据容器的思维模型。\n【核心概念】\n- 列表/字典\n【练习任务】\n- 定义股票字典列表\n- 描述过滤需求→AI写代码\n- 故意模糊描述',tasks:['定义股票字典列表，AI提取字段','描述过滤需求→AI写代码→验证','故意模糊描述，观察AI偏差']}]}]},{id:2,name:'阶段二：数据处理入门',sections:[{name:'文件与数据读写',days:[{d:4,title:'文件读写基础',desc:'程序只有能读取外部数据才算真正有用。',prompt:'=== 第4天：文件读写 ===\n\n【学习时长】约3小时\n【练习任务】\n- 创建文件写入数据\n- 读取统计\n- with语句改写',tasks:['创建文本文件写入10行','读取统计行数和字数','with语句改写']},{d:5,title:'CSV与JSON',desc:'CSV是表格，JSON是嵌套结构。',prompt:'=== 第5天：CSV与JSON ===\n\n【学习时长】约2.5小时\n【练习任务】\n- csv.DictReader\n- json序列化\n- CSV→JSON',tasks:['csv.DictReader读取CSV','json序列化字典列表','CSV→JSON转换']}]},{name:'数据分析基础',days:[{d:6,title:'数据清洗',desc:'真实数据从来都不干净。',prompt:'=== 第6天：数据清洗 ===\n\n【学习时长】约2.5小时\n【练习任务】\n- 统计缺失\n- 中位数填充\n- IQR检测',tasks:['统计缺失比例','中位数填充缺失值','IQR检测异常值']},{d:7,title:'数据可视化',desc:'一张好图胜过千行数据。',prompt:'=== 第7天：数据可视化 ===\n\n【学习时长】约3小时\n【练习任务】\n- 折线图\n- 柱状图\n- 散点图',tasks:['画折线图展示趋势','画分组柱状图比较','画散点图观察关系']},{d:8,title:'数据分析报告',desc:'分析的终点是结论。',prompt:'=== 第8天：数据分析报告 ===\n\n【学习时长】约3小时\n【练习任务】\n- 提3个问题\n- 清洗+可视化\n- 写结论',tasks:['选择数据集提出3个问题','清洗、分析、可视化','写数据分析结论']}]}]}],_map:null,totalDays:8,getDay(n){if(!this._map){this._map={};this.stages.forEach(s=>{s.sections.forEach(sec=>{sec.days.forEach(d=>{this._map[d.d]={...d,stageName:s.name,sectionName:sec.name}})})})}return this._map[n]||null},getPrevDay(n){for(let i=n-1;i>=1;i--)if(this.getDay(i))return i;return null},getNextDay(n){for(let i=n+1;i<=this.totalDays;i++)if(this.getDay(i))return i;return null}};
var MATH_TRACK={name:'数学',modules:[{id:1,name:'数学思维基础',days:[{d:1,sync:39,title:'函数思维',desc:'建立「函数 = 确定的映射规则」的直觉。',prompt:'=== MATH DAY 1：函数思维 ===\n\n【学习时长】约25分钟\n【练习任务】\n- f(x)=2x+1画图\n- x²和sin(x)\n- 描述差异',tasks:['f(x)=2x+1，画折线图','f(x)=x²和g(x)=sin(x)','描述形状差异']},{d:2,sync:40,title:'坐标与图形',desc:'用坐标系把数字关系画出来。',prompt:'=== MATH DAY 2：坐标与图形 ===\n\n【学习时长】约25分钟\n【练习任务】\n- 画折线图\n- 三条线\n- 解释趋势',tasks:['matplotlib画折线图','三条线不同颜色','解释趋势']},{d:3,sync:41,title:'变化率——斜率',desc:'斜率 = x每增加1，y变化多少。',prompt:'=== MATH DAY 3：斜率 ===\n\n【学习时长】约25分钟\n【练习任务】\n- 计算斜率\n- 比较不同斜率\n- 生活含义',tasks:['计算斜率','比较不同斜率直线','解释变化率']}]},{id:3,name:'模块三：线性代数基础',days:[{d:24,sync:null,title:'向量是什么',desc:'在AI中，768维Embedding也是向量。',prompt:'=== MATH DAY 24：向量 ===\n\n【学习时长】约25分钟\n【练习任务】\n- 画二维向量\n- 理解Embedding\n- 解释方向和大小',tasks:['画出二维向量','理解Embedding','解释方向和大小']},{d:27,sync:42,title:'向量点积——相似度的根源',desc:'ChromaDB/RAG的数学基础。夹角越小语义越接近。',prompt:'=== MATH DAY 27：向量点积 ===\n\n【学习时长】约25分钟\n【关联】Main Day 42：Embedding向量检索\n【学习目的】点积=方向一致性度量\n【核心概念】\n- 点积 v·w = |v||w|cos(θ)\n- θ=0°→cos=1→最大\n- θ=90°→cos=0\n- θ=180°→cos=-1\n- 余弦相似度∈[-1,+1]\n【练习任务】\n- v1=[1,2],v2=[2,4],v3=[-2,1]\n- 写cosine_sim()\n- 画图解释夹角\n- 思考：0.95 vs 0.02',tasks:['手算 v1·v2 和 v1·v3','写 cosine_sim() 函数','画图解释夹角对应余弦值']}]}],_map:null,totalDays:5,getDay(n){if(!this._map){this._map={};this.modules.forEach(m=>{m.days.forEach(d=>{this._map[d.d]={...d,moduleName:m.name}})})}return this._map[n]||null},allDays(){let a=[];this.modules.forEach(m=>{m.days.forEach(d=>a.push(d))});return a.sort((x,y)=>x.d-y.d)},getPrevDay(n){let all=this.allDays().map(d=>d.d);let idx=all.indexOf(n);return idx>0?all[idx-1]:null},getNextDay(n){let all=this.allDays().map(d=>d.d);let idx=all.indexOf(n);return idx<all.length-1?all[idx+1]:null}};
var currentTrack='main',currentDay=1;
var KEY_MAIN='on_main',KEY_MATH='on_math';
var Store={key(){return currentTrack==='math'?KEY_MATH:KEY_MAIN},load(){try{return JSON.parse(localStorage.getItem(this.key()))||{}}catch(e){return{}}},save(d){localStorage.setItem(this.key(),JSON.stringify(d))},toggleTask(day,idx){let d=this.load(),dk='d'+day;if(!d[dk])d[dk]={tasks:[false,false,false]};d[dk].tasks[idx]=!d[dk].tasks[idx];this.save(d)},isTaskDone(day,idx){return!!(this.load()['d'+day]&&this.load()['d'+day].tasks&&this.load()['d'+day].tasks[idx])},isDayDone(day){return!!(this.load()['d'+day]&&this.load()['d'+day].tasks&&this.load()['d'+day].tasks.every(t=>t))},getLevel(day){let d=this.load(),dk='d'+day;if(!d[dk]||!d[dk].tasks)return 0;let done=d[dk].tasks.filter(t=>t).length;if(done===3)return 4;if(done===2)return 3;if(done===1)return 2;return 1},getDoneCount(){let c=0;if(currentTrack==='math'){MATH_TRACK.allDays().forEach(day=>{if(this.isDayDone(day.d))c++})}else{for(let i=1;i<=MAIN_PLAN.totalDays;i++){if(this.isDayDone(i))c++}}return c},getStreak(){let doneCount=this.getDoneCount(),prefix=currentTrack==='math'?'on_ms':'on_ms2';function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}let today=new Date(),ss=localStorage.getItem('ss_'+prefix),baseline=parseInt(localStorage.getItem('bl_'+prefix))||0;if(!ss){if(doneCount>0){let defS=4,sd=new Date(today.getFullYear(),today.getMonth(),today.getDate()-defS+1);ss=fmt(sd);baseline=Math.max(0,doneCount-defS)}else{ss=fmt(today);baseline=0}localStorage.setItem('ss_'+prefix,ss);localStorage.setItem('bl_'+prefix,String(baseline))}let tOnly=new Date(today.getFullYear(),today.getMonth(),today.getDate()),p=ss.split('-'),sOnly=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])),daysSince=Math.floor((tOnly-sOnly)/86400000)+1,newlyDone=doneCount-baseline;if(newlyDone>=daysSince-1)return Math.min(newlyDone,daysSince);return 0}};
function getPlan(){return currentTrack==='math'?MATH_TRACK:MAIN_PLAN}
function renderAll(){renderHome();renderSidebar();updateStats()}
function renderHome(){let plan=getPlan(),stageList=document.getElementById('stage-list');stageList.innerHTML='';if(currentTrack==='math'){MATH_TRACK.modules.forEach(mod=>{let card=document.createElement('div');card.className='stage-card open';let hd=document.createElement('div');hd.className='stage-hd';hd.innerHTML='<div class="stage-hd-l"><span class="stage-arrow">▶</span><span class="stage-name">'+mod.name+'</span></div><span class="stage-meta">'+mod.days.length+'天</span>';hd.addEventListener('click',()=>card.classList.toggle('open'));card.appendChild(hd);let body=document.createElement('div');body.className='stage-body';let grid=document.createElement('div');grid.className='day-grid';mod.days.forEach(day=>{let cell=document.createElement('div');cell.className='day-cell';cell.setAttribute('data-lv',Store.getLevel(day.d));let tip=document.createElement('span');tip.className='cell-tip';tip.textContent='M'+day.d+': '+day.title;cell.appendChild(tip);cell.addEventListener('click',()=>goDay(day.d));grid.appendChild(cell)});body.appendChild(grid);card.appendChild(body);stageList.appendChild(card)})}else{MAIN_PLAN.stages.forEach(stage=>{let card=document.createElement('div');card.className='stage-card open';let hd=document.createElement('div');hd.className='stage-hd';hd.innerHTML='<div class="stage-hd-l"><span class="stage-arrow">▶</span><span class="stage-name">'+stage.name+'</span></div>';hd.addEventListener('click',()=>card.classList.toggle('open'));card.appendChild(hd);let body=document.createElement('div');body.className='stage-body';stage.sections.forEach(sec=>{let st=document.createElement('div');st.className='sec-title';st.textContent=sec.name;body.appendChild(st);let grid=document.createElement('div');grid.className='day-grid';sec.days.forEach(day=>{let cell=document.createElement('div');cell.className='day-cell';cell.setAttribute('data-lv',Store.getLevel(day.d));let tip=document.createElement('span');tip.className='cell-tip';tip.textContent='Day '+day.d+': '+day.title;cell.appendChild(tip);cell.addEventListener('click',()=>goDay(day.d));grid.appendChild(cell)});body.appendChild(grid)});card.appendChild(body);stageList.appendChild(card)})}}
function renderSidebar(){let sb=document.getElementById('sidebar');sb.innerHTML='';if(currentTrack==='math'){MATH_TRACK.modules.forEach(mod=>{let wrap=document.createElement('div');wrap.className='side-stage open';let hd=document.createElement('div');hd.className='side-stage-hd';hd.innerHTML='<span class="side-arrow">▶</span><span class="side-stage-name">'+mod.name+'</span><span class="side-stage-n">'+mod.days.length+'天</span>';hd.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open')});wrap.appendChild(hd);let bd=document.createElement('div');bd.className='side-body';mod.days.forEach(day=>{let item=document.createElement('div');item.className='side-item';let lv=Store.getLevel(day.d);item.innerHTML='<span class="side-dot d'+lv+'"></span>M'+day.d+': '+day.title;if(currentDay===day.d)item.classList.add('active');item.addEventListener('click',e=>{e.stopPropagation();goDay(day.d)});bd.appendChild(item)});wrap.appendChild(bd);sb.appendChild(wrap)})}else{MAIN_PLAN.stages.forEach(stage=>{let wrap=document.createElement('div');wrap.className='side-stage open';let hd=document.createElement('div');hd.className='side-stage-hd';hd.innerHTML='<span class="side-arrow">▶</span><span class="side-stage-name">'+stage.name+'</span>';hd.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open')});wrap.appendChild(hd);let bd=document.createElement('div');bd.className='side-body';stage.sections.forEach(sec=>{sec.days.forEach(day=>{let item=document.createElement('div');item.className='side-item';let lv=Store.getLevel(day.d);item.innerHTML='<span class="side-dot d'+lv+'"></span>Day '+day.d+': '+day.title;if(currentDay===day.d)item.classList.add('active');item.addEventListener('click',e=>{e.stopPropagation();goDay(day.d)});bd.appendChild(item)})});wrap.appendChild(bd);sb.appendChild(wrap)})}}
function renderDay(globalDay){let p=getPlan(),dd=p.getDay(globalDay);if(!dd){goHome();return}currentDay=globalDay;document.getElementById('day-breadcrumb').innerHTML=currentTrack==='math'?'数学 › '+dd.moduleName+' › <span class="cur">Day '+globalDay+'</span>':'主计划 › '+dd.stageName+' › '+dd.sectionName+' › <span class="cur">Day '+globalDay+'</span>';document.getElementById('day-num').textContent=globalDay;document.getElementById('day-meta').textContent=dd.title;document.getElementById('day-desc').textContent=dd.desc;document.getElementById('prompt-body').textContent=dd.prompt;let sync=document.getElementById('sync-badge');if(currentTrack==='math'&&dd.sync){sync.style.display='inline-flex';sync.textContent='↗ 同步：Main Day '+dd.sync;sync.onclick=function(){currentTrack='main';goDay(dd.sync)}}else{sync.style.display='none'}let tl=document.getElementById('task-list');tl.innerHTML='';dd.tasks.forEach((task,idx)=>{let label=document.createElement('label');label.className='task-item';if(Store.isTaskDone(globalDay,idx))label.classList.add('done');let chk=document.createElement('div');chk.className='task-chk';chk.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';let txt=document.createElement('span');txt.className='task-txt';txt.textContent=task;label.appendChild(chk);label.appendChild(txt);label.addEventListener('click',function(){Store.toggleTask(globalDay,idx);label.classList.toggle('done');updateDayFooter(globalDay);renderAll();checkOverlay()});tl.appendChild(label)});updateDayFooter(globalDay);checkOverlay();let prevDay=currentTrack==='math'?MATH_TRACK.getPrevDay(globalDay):MAIN_PLAN.getPrevDay(globalDay),nextDay=currentTrack==='math'?MATH_TRACK.getNextDay(globalDay):MAIN_PLAN.getNextDay(globalDay);document.getElementById('btn-prev').style.visibility=prevDay?'visible':'hidden';document.getElementById('btn-next').style.visibility=nextDay?'visible':'hidden';document.getElementById('view-home').classList.remove('active');document.getElementById('view-day').classList.add('active');document.getElementById('content').scrollTop=0}
function updateDayFooter(d){let p=getPlan(),done=Store.isDayDone(d),data=Store.load(),dk='d'+d,doneCount=(data[dk]&&data[dk].tasks)?data[dk].tasks.filter(t=>t).length:0,dd=p.getDay(d),totalTasks=dd?dd.tasks.length:3,el=document.getElementById('footer-status');if(done){el.textContent='Day '+d+' — COMPLETE ✓';el.style.color='var(--olive)'}else{el.textContent='Tasks: '+doneCount+'/'+totalTasks;el.style.color=''}}
function updateStats(){let p=getPlan(),done=Store.getDoneCount(),total=currentTrack==='math'?MATH_TRACK.allDays().length:p.totalDays,pct=total>0?Math.round(done/total*100):0,streak=Store.getStreak();document.getElementById('tb-done').textContent=done+'/'+total;document.getElementById('tb-pct').textContent=pct+'%';document.getElementById('tb-streak').textContent=streak+'d';document.getElementById('progress-bar').style.width=pct+'%';document.querySelectorAll('.tb-track').forEach(t=>t.classList.toggle('active',t.getAttribute('data-track')===currentTrack));let ss=document.getElementById('stats-strip');if(ss)ss.innerHTML='<span>已完成 <strong class="stat-num">'+done+'/'+total+'</strong></span><span>进度 <strong class="stat-num">'+pct+'%</strong></span><span>连续学习 <strong class="stat-num">'+streak+' 天</strong></span>'}
function checkOverlay(){let total=currentTrack==='math'?MATH_TRACK.allDays().length:MAIN_PLAN.totalDays,allDone=true;if(currentTrack==='math'){MATH_TRACK.allDays().forEach(d=>{if(!Store.isDayDone(d.d))allDone=false})}else{for(let i=1;i<=total;i++){if(!Store.isDayDone(i)){allDone=false;break}}}let ov=document.getElementById('overlay');if(allDone&&total>0){ov.classList.add('show');document.getElementById('overlay-msg').textContent=(currentTrack==='math'?'Math Track':'Main Plan')+' 全部完成 🌿'}else{ov.classList.remove('show')}}
function goHome(){document.getElementById('view-day').classList.remove('active');document.getElementById('view-home').classList.add('active');document.getElementById('overlay').classList.remove('show');currentDay=null;renderAll()}
function goDay(d){currentDay=d;renderDay(d);renderSidebar();updateStats()}
function navDay(dir){let p=getPlan(),next=dir>0?(currentTrack==='math'?MATH_TRACK.getNextDay(currentDay):p.getNextDay(currentDay)):(currentTrack==='math'?MATH_TRACK.getPrevDay(currentDay):p.getPrevDay(currentDay));if(next)goDay(next)}
function switchTrack(track){if(track===currentTrack)return;currentTrack=track;goHome()}
var _toastTimer=null;function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(_toastTimer)clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
function copyPrompt(){let text=document.getElementById('prompt-body').textContent;navigator.clipboard.writeText(text).then(()=>{let btn=document.getElementById('copy-btn');btn.classList.add('copied');btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!';showToast('✓ Copied!');setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy'},2000)}).catch(()=>showToast('Copy failed'))}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open-mobile')}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();let dd=getPlan().getDay(currentDay);if(dd){for(let i=0;i<dd.tasks.length;i++){if(!Store.isTaskDone(currentDay,i)){document.querySelectorAll('#task-list .task-item')[i]?.click();break}}}}if(e.key==='Escape')goHome()});
document.addEventListener('DOMContentLoaded',function(){renderAll();goDay(1)});
</script>
