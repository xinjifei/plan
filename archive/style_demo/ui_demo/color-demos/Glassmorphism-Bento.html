<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Bento · 学习计划追踪器</title>
<style>
/* ================================================================
   Glassmorphism Bento — 毛玻璃 + Bento网格 + 渐变背景
   参考: banner-sizes-and-styles.md §Glassmorphism
        social-photos-design.md §Glassmorphism
        ui-ux-pro-max §Style Selection
   特征: backdrop-filter blur · 半透明卡片 · 渐变底 · 微边框发光 · 分层悬浮
   ================================================================ */

:root {
  /* 渐变底色 */
  --grad-1: #0f0c29;
  --grad-2: #302b63;
  --grad-3: #24243e;
  /* 毛玻璃 */
  --glass-bg: rgba(255,255,255,0.06);
  --glass-bg2: rgba(255,255,255,0.10);
  --glass-bg3: rgba(255,255,255,0.15);
  --glass-hover: rgba(255,255,255,0.14);
  --glass-border: rgba(255,255,255,0.10);
  --glass-border2: rgba(255,255,255,0.16);
  /* 文字 */
  --text: #e8e6f0;
  --text2: #a09cb8;
  --text3: #6e6a85;
  /* 强调色 */
  --accent: #a78bfa;
  --accent2: #67e8f9;
  --accent3: #f472b6;
  --success: #6ee7b7;
  /* 热力 */
  --c0: rgba(255,255,255,0.04); --c1: rgba(167,139,250,0.25); --c2: rgba(167,139,250,0.45);
  --c3: rgba(167,139,250,0.65); --c4: rgba(167,139,250,0.85);
  --font: "Inter","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono: "JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,Consolas,monospace;
  --r-sm: 12px; --r-md: 16px; --r-lg: 20px; --r-full: 9999px;
  --blur: 16px;
  --ease: cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:var(--font);font-size:14px;line-height:1.6}
body{
  background: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 50%, var(--grad-3) 100%);
  color: var(--text);
}

/* Decorative orbs */
body::before, body::after{
  content:'';position:fixed;border-radius:50%;pointer-events:none;z-index:0;
}
body::before{
  width:500px;height:500px;top:-150px;right:-100px;
  background: radial-gradient(circle, rgba(167,139,250,0.18) 0%, transparent 70%);
}
body::after{
  width:400px;height:400px;bottom:-100px;left:-80px;
  background: radial-gradient(circle, rgba(103,232,249,0.14) 0%, transparent 70%);
}

/* Topbar — 毛玻璃 */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  height:48px;padding:0 20px;flex-shrink:0;position:relative;z-index:50;
  background: var(--glass-bg);
  backdrop-filter: blur(var(--blur));-webkit-backdrop-filter: blur(var(--blur));
  border-bottom: 1px solid var(--glass-border);
}
.tb-l{display:flex;align-items:center;gap:10px}
.tb-logo{
  width:30px;height:30px;border-radius:var(--r-sm);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;
  box-shadow: 0 4px 16px rgba(167,139,250,0.3);
}
.tb-title{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.tb-badge{font-size:10px;font-weight:600;padding:2px 10px;border-radius:var(--r-full);background:rgba(167,139,250,0.15);color:var(--accent);border:1px solid rgba(167,139,250,0.25)}

.tb-center{display:flex;border:1px solid var(--glass-border2);border-radius:var(--r-sm);overflow:hidden;background:var(--glass-bg);backdrop-filter:blur(8px)}
.tb-track{padding:5px 18px;font-size:12px;font-weight:500;font-family:var(--font);border:none;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s var(--ease)}
.tb-track:first-child{border-right:1px solid var(--glass-border)}
.tb-track.active{background:rgba(167,139,250,0.2);color:var(--accent)}
.tb-track:hover:not(.active){color:var(--text)}

.tb-r{display:flex;align-items:center;gap:16px;font-size:11px;color:var(--text2)}
.tb-stat{display:flex;align-items:center;gap:4px}
.tb-stat-v{font-weight:600;color:var(--text);font-family:var(--mono);font-size:12px}

/* Progress */
.progress-wrap{height:2px;background:rgba(255,255,255,0.04);flex-shrink:0}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s var(--ease);box-shadow:0 0 8px rgba(167,139,250,0.4)}

/* Layout */
.app-layout{display:flex;height:calc(100vh - 48px - 2px);position:relative;z-index:1}

/* Sidebar — 毛玻璃 */
.sidebar{
  width:210px;flex-shrink:0;overflow-y:auto;padding:10px 0;
  background: var(--glass-bg);backdrop-filter: blur(var(--blur));
  border-right:1px solid var(--glass-border);
  display:flex;flex-direction:column;gap:1px;transition:transform .25s var(--ease);
}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.side-stage{user-select:none}
.side-stage-hd{display:flex;align-items:center;gap:6px;padding:6px 14px;cursor:pointer;font-size:12px;color:var(--text2);transition:background .1s}
.side-stage-hd:hover{background:var(--glass-hover)}
.side-arrow{font-size:9px;color:var(--text3);transition:transform .15s;display:inline-block}
.side-stage.open>.side-stage-hd .side-arrow{transform:rotate(90deg)}
.side-stage-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.side-stage-n{font-family:var(--mono);font-size:10px;color:var(--text3)}

.side-body{display:none;padding-left:14px}
.side-stage.open>.side-body{display:block}
.side-item{display:block;padding:4px 12px 4px 18px;font-size:11px;color:var(--text3);cursor:pointer;transition:all .1s;border-radius:6px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-item:hover{background:var(--glass-hover);color:var(--text2)}
.side-item.active{color:var(--accent);font-weight:600;background:rgba(167,139,250,0.1)}
.side-item.active::before{content:'';position:absolute;left:6px;top:50%;transform:translateY(-50%);width:3px;height:3px;border-radius:50%;background:var(--accent)}
.side-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0}
.side-dot.d0{background:rgba(255,255,255,0.08)}.side-dot.d1{background:var(--c1)}
.side-dot.d2{background:var(--c2)}.side-dot.d3{background:var(--c3)}.side-dot.d4{background:var(--c4)}

/* Content */
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}
.view{display:none}
.view.active{display:block}

/* ===== HOME VIEW — Bento Grid ===== */
.home{padding:20px 24px 40px;max-width:800px;margin:0 auto}

/* Hero stat bento row */
.bento-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px}
.bento-card{
  background: var(--glass-bg2);backdrop-filter: blur(12px);
  border:1px solid var(--glass-border2);border-radius:var(--r-md);
  padding:18px 20px;transition:all .25s var(--ease);
}
.bento-card:hover{background:var(--glass-bg3);border-color:rgba(255,255,255,0.22);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.bento-card.wide{grid-column:span 2}
.bento-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.bento-val{font-size:32px;font-weight:700;color:var(--text);font-family:var(--mono);letter-spacing:-0.02em}
.bento-sub{font-size:11px;color:var(--text3);margin-top:2px}
.bento-val.accent{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* Stage cards */
.stage-card{
  background: var(--glass-bg2);backdrop-filter: blur(12px);
  border:1px solid var(--glass-border2);border-radius:var(--r-md);
  overflow:hidden;margin-bottom:14px;transition:all .25s var(--ease);
}
.stage-card:hover{border-color:rgba(255,255,255,0.2);box-shadow:0 8px 24px rgba(0,0,0,0.15)}
.stage-card.open .stage-body{display:block}
.stage-card:not(.open) .stage-body{display:none}

.stage-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;cursor:pointer;user-select:none;transition:background .1s}
.stage-hd:hover{background:var(--glass-hover)}
.stage-hd-l{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.stage-arrow{color:var(--text3);font-size:10px;transition:transform .15s}
.stage-card.open .stage-arrow{transform:rotate(90deg)}
.stage-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-meta{font-family:var(--mono);font-size:10px;color:var(--text3);flex-shrink:0}

.stage-body{padding:12px 18px 18px;border-top:1px solid var(--glass-border)}

.sec-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
.sec-title::after{content:'';flex:1;height:1px;background:var(--glass-border)}

.day-grid{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0}
.day-cell{width:22px;height:22px;border-radius:6px;cursor:pointer;flex-shrink:0;position:relative;transition:all .12s var(--ease)}
.day-cell:hover{outline:2px solid var(--accent2);outline-offset:3px;z-index:2;transform:scale(1.18)}
.day-cell:active{transform:scale(0.85)}
.day-cell[data-lv="0"]{background:var(--c0);border:1px solid var(--glass-border)}
.day-cell[data-lv="1"]{background:var(--c1);border:1px solid rgba(167,139,250,0.15)}
.day-cell[data-lv="2"]{background:var(--c2);border:1px solid rgba(167,139,250,0.25)}
.day-cell[data-lv="3"]{background:var(--c3);border:1px solid rgba(167,139,250,0.35)}
.day-cell[data-lv="4"]{background:var(--c4);box-shadow:0 0 8px rgba(167,139,250,0.3)}

.cell-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:5px 12px;background:rgba(15,12,41,0.95);color:#fff;font-size:11px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20;font-family:var(--font);border:1px solid var(--glass-border2);backdrop-filter:blur(8px)}
.cell-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:rgba(15,12,41,0.95)}
.day-cell:hover .cell-tip{opacity:1}

.legend{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 0 0;font-size:10px;color:var(--text3)}
.legend-sq{display:inline-block;width:10px;height:10px;border-radius:3px}

/* ===== DAY VIEW ===== */
.day-view{padding:0}
.day-inner{max-width:680px;margin:0 auto;padding:0 20px 40px}

.breadcrumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--glass-border);font-size:12px;color:var(--text3)}
.breadcrumb .cur{color:var(--text);font-weight:600}

.day-hd{padding:18px 0 0}
.day-label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.day-meta{font-size:26px;font-weight:700;line-height:1.3;color:var(--text);letter-spacing:-0.02em}

.sync-row{padding:10px 0}
.sync-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 14px;font-size:11px;font-weight:500;font-family:var(--font);background:rgba(167,139,250,0.1);color:var(--accent);border:1px solid rgba(167,139,250,0.2);border-radius:var(--r-full);cursor:pointer;transition:all .15s var(--ease)}
.sync-badge:hover{background:rgba(167,139,250,0.2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(167,139,250,0.15)}

.day-desc{padding:4px 0 14px;font-size:14px;line-height:1.8;color:var(--text2);border-bottom:1px solid var(--glass-border)}

/* Prompt card */
.prompt-card{margin-top:16px;background:var(--glass-bg);backdrop-filter:blur(12px);border:1px solid var(--glass-border2);border-radius:var(--r-md);overflow:hidden;transition:all .25s var(--ease)}
.prompt-card:hover{border-color:rgba(255,255,255,0.22);box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.prompt-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--glass-bg2);border-bottom:1px solid var(--glass-border)}
.prompt-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.prompt-label::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--accent);box-shadow:0 0 6px rgba(167,139,250,0.4)}
.prompt-body{padding:18px;font-size:12.5px;line-height:1.8;color:var(--text2);white-space:pre-wrap;word-break:break-word;font-family:var(--font);max-height:400px;overflow-y:auto}
.prompt-body::-webkit-scrollbar{width:4px}
.prompt-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:2px}

/* Tasks */
.task-section{margin-top:18px}
.task-section-hd{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;padding:0 4px}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:11px 16px;border-radius:var(--r-sm);cursor:pointer;transition:all .15s var(--ease);border:1px solid transparent}
.task-item:hover{background:var(--glass-bg2);border-color:var(--glass-border2)}
.task-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--glass-border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:transparent;transition:all .15s var(--ease)}
.task-item:hover .task-chk{border-color:var(--accent)}
.task-item.done .task-chk{background:var(--success);border-color:var(--success);box-shadow:0 0 10px rgba(110,231,183,0.3)}
.task-chk svg{opacity:0;transition:opacity .15s}
.task-item.done .task-chk svg{opacity:1}
.task-txt{font-size:13px;color:var(--text);flex:1;line-height:1.6;transition:all .15s}
.task-item.done .task-txt{text-decoration:line-through;color:var(--text3)}
.task-item.done{opacity:.55}

/* Footer */
.day-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--glass-border2);font-size:12px;color:var(--text3)}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;font-size:12px;font-weight:500;font-family:var(--font);border:1px solid var(--glass-border2);border-radius:var(--r-sm);background:var(--glass-bg2);color:var(--text2);cursor:pointer;transition:all .15s var(--ease);backdrop-filter:blur(8px)}
.btn:hover{background:var(--glass-bg3);border-color:rgba(255,255,255,0.25);color:var(--text)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(167,139,250,0.3)}
.btn.primary:hover{box-shadow:0 6px 20px rgba(167,139,250,0.45);transform:translateY(-1px)}
.btn.copy.copied{background:rgba(110,231,183,0.15);border-color:var(--success);color:var(--success)}
.btn-group{display:flex;gap:6px}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,12,41,0.92);backdrop-filter:blur(20px);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.ov-icon{width:64px;height:64px;border-radius:50%;background:rgba(110,231,183,0.12);border:2px solid var(--success);display:flex;align-items:center;justify-content:center;animation:ov-pulse 1.6s ease-in-out infinite;box-shadow:0 0 24px rgba(110,231,183,0.2)}
@keyframes ov-pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(110,231,183,0.3)}50%{transform:scale(1.06);box-shadow:0 0 0 18px rgba(110,231,183,0)}}
.ov-msg{margin-top:14px;font-size:20px;font-weight:700;color:var(--text)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:6px;padding:10px 20px;background:rgba(15,12,41,0.95);color:#fff;border-radius:var(--r-full);font-size:12px;font-weight:500;opacity:0;pointer-events:none;z-index:300;box-shadow:0 8px 28px rgba(0,0,0,0.3);border:1px solid var(--glass-border2);backdrop-filter:blur(12px);transition:all .3s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Sidebar toggle */
.sidebar-toggle{display:none;width:36px;height:36px;align-items:center;justify-content:center;background:var(--glass-bg2);border:1px solid var(--glass-border2);border-radius:var(--r-sm);cursor:pointer;font-size:16px;color:var(--text2);backdrop-filter:blur(8px)}

@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:48px;bottom:0;z-index:40;transform:translateX(-100%);box-shadow:4px 0 24px rgba(0,0,0,0.3)}
  .sidebar.open-mobile{transform:translateX(0)}
  .sidebar-toggle{display:flex}
  .home{padding:14px 14px 32px}
  .day-inner{padding:0 14px 32px}
  .day-meta{font-size:21px}
  .bento-row{grid-template-columns:1fr 1fr}
  .tb-center{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
@media print{.topbar,.sidebar,.progress-wrap,.toast,.overlay,.btn,body::before,body::after{display:none!important}body{background:#fff!important;overflow:visible;height:auto}.glass-bg,.glass-bg2{background:#fff!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="tb-l">
    <div class="tb-logo">◆</div>
    <span class="tb-title">量化学习计划追踪</span>
    <span class="tb-badge" id="tb-badge">主计划</span>
    <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="切换导航">☰</button>
  </div>
  <div class="tb-center">
    <button class="tb-track active" data-track="main" onclick="switchTrack('main')">主计划</button>
    <button class="tb-track" data-track="math" onclick="switchTrack('math')">数学</button>
  </div>
  <div class="tb-r">
    <div class="tb-stat">完成 <span class="tb-stat-v" id="tb-done">0/8</span></div>
    <div class="tb-stat">进度 <span class="tb-stat-v" id="tb-pct">0%</span></div>
    <div class="tb-stat">连续 <span class="tb-stat-v" id="tb-streak">0d</span></div>
  </div>
</header>
<div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<div class="app-layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content" id="content">

    <div class="view active" id="view-home">
      <div class="home">
        <div class="bento-row" id="bento-row">
          <!-- dynamically filled -->
        </div>
        <div id="stage-list"></div>
        <div class="legend">
          <span>未开始</span><span class="legend-sq" style="background:var(--c0);border:1px solid var(--glass-border)"></span>
          <span class="legend-sq" style="background:var(--c1)"></span>
          <span class="legend-sq" style="background:var(--c2)"></span>
          <span class="legend-sq" style="background:var(--c3)"></span>
          <span class="legend-sq" style="background:var(--c4)"></span><span>完成</span>
        </div>
      </div>
    </div>

    <div class="view day-view" id="view-day">
      <div class="day-inner">
        <div class="breadcrumb" id="day-breadcrumb"></div>
        <div class="day-hd">
          <div class="day-label">Day <span id="day-num"></span></div>
          <h1 class="day-meta" id="day-meta"></h1>
        </div>
        <div class="sync-row"><button class="sync-badge" id="sync-badge" style="display:none"></button></div>
        <p class="day-desc" id="day-desc"></p>
        <div class="prompt-card">
          <div class="prompt-hd"><span class="prompt-label">Prompt</span><button class="btn copy" id="copy-btn" onclick="copyPrompt()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button></div>
          <pre class="prompt-body" id="prompt-body"></pre>

        let cell=document.createElement('div');cell.className='day-cell';cell.setAttribute('data-lv',Store.getLevel(day.d));
        let tip=document.createElement('span');tip.className='cell-tip';tip.textContent='M'+day.d+': '+day.title;
        cell.appendChild(tip);cell.addEventListener('click',()=>goDay(day.d));grid.appendChild(cell)
      });
      body.appendChild(grid);card.appendChild(body);stageList.appendChild(card)
    })
  } else {
    MAIN_PLAN.stages.forEach(stage=>{
      let card=document.createElement('div');card.className='stage-card open';
      let hd=document.createElement('div');hd.className='stage-hd';
      hd.innerHTML='<div class="stage-hd-l"><span class="stage-arrow">▶</span><span class="stage-name">'+stage.name+'</span></div>';
      hd.addEventListener('click',()=>card.classList.toggle('open'));card.appendChild(hd);
      let body=document.createElement('div');body.className='stage-body';
      stage.sections.forEach(sec=>{
        let st=document.createElement('div');st.className='sec-title';st.textContent=sec.name;body.appendChild(st);
        let grid=document.createElement('div');grid.className='day-grid';
        sec.days.forEach(day=>{
          let cell=document.createElement('div');cell.className='day-cell';cell.setAttribute('data-lv',Store.getLevel(day.d));
          let tip=document.createElement('span');tip.className='cell-tip';tip.textContent='Day '+day.d+': '+day.title;
          cell.appendChild(tip);cell.addEventListener('click',()=>goDay(day.d));grid.appendChild(cell)
        });
        body.appendChild(grid)
      });
      card.appendChild(body);stageList.appendChild(card)
    })
  }
}

function renderSidebar(){
  let sb=document.getElementById('sidebar');sb.innerHTML='';
  if(currentTrack==='math'){
    MATH_TRACK.modules.forEach(mod=>{
      let wrap=document.createElement('div');wrap.className='side-stage open';
      let hd=document.createElement('div');hd.className='side-stage-hd';
      hd.innerHTML='<span class="side-arrow">▶</span><span class="side-stage-name">'+mod.name+'</span><span class="side-stage-n">'+mod.days.length+'天</span>';
      hd.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open')});wrap.appendChild(hd);
      let bd=document.createElement('div');bd.className='side-body';
      mod.days.forEach(day=>{
        let item=document.createElement('div');item.className='side-item';let lv=Store.getLevel(day.d);
        item.innerHTML='<span class="side-dot d'+lv+'"></span>M'+day.d+': '+day.title;
        if(currentDay===day.d)item.classList.add('active');
        item.addEventListener('click',e=>{e.stopPropagation();goDay(day.d)});bd.appendChild(item)
      });
      wrap.appendChild(bd);sb.appendChild(wrap)
    })
  } else {
    MAIN_PLAN.stages.forEach(stage=>{
      let wrap=document.createElement('div');wrap.className='side-stage open';
      let hd=document.createElement('div');hd.className='side-stage-hd';
      hd.innerHTML='<span class="side-arrow">▶</span><span class="side-stage-name">'+stage.name+'</span>';
      hd.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open')});wrap.appendChild(hd);
      let bd=document.createElement('div');bd.className='side-body';
      stage.sections.forEach(sec=>{sec.days.forEach(day=>{
        let item=document.createElement('div');item.className='side-item';let lv=Store.getLevel(day.d);
        item.innerHTML='<span class="side-dot d'+lv+'"></span>Day '+day.d+': '+day.title;
        if(currentDay===day.d)item.classList.add('active');
        item.addEventListener('click',e=>{e.stopPropagation();goDay(day.d)});bd.appendChild(item)
      })});
      wrap.appendChild(bd);sb.appendChild(wrap)
    })
  }
}

function renderDay(globalDay){
  let plan=getPlan(),dayData=plan.getDay(globalDay);
  if(!dayData){goHome();return}
  currentDay=globalDay;
  document.getElementById('day-breadcrumb').innerHTML=currentTrack==='math'?'数学 <span style="color:var(--text3)">›</span> '+dayData.moduleName+' <span style="color:var(--text3)">›</span> <span class="cur">Day '+globalDay+'</span>':'主计划 <span style="color:var(--text3)">›</span> '+dayData.stageName+' <span style="color:var(--text3)">›</span> '+dayData.sectionName+' <span style="color:var(--text3)">›</span> <span class="cur">Day '+globalDay+'</span>';
  document.getElementById('day-num').textContent=globalDay;
  document.getElementById('day-meta').textContent=dayData.title;
  document.getElementById('day-desc').textContent=dayData.desc;
  document.getElementById('prompt-body').textContent=dayData.prompt;
  let sync=document.getElementById('sync-badge');
  if(currentTrack==='math'&&dayData.sync){sync.style.display='inline-flex';sync.textContent='↗ 同步：Main Day '+dayData.sync;sync.onclick=function(){currentTrack='main';switchTrackUI();goDay(dayData.sync)}}else{sync.style.display='none'}
  let tl=document.getElementById('task-list');tl.innerHTML='';
  dayData.tasks.forEach((task,idx)=>{
    let label=document.createElement('label');label.className='task-item';
    if(Store.isTaskDone(globalDay,idx))label.classList.add('done');
    let chk=document.createElement('div');chk.className='task-chk';
    chk.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
    let txt=document.createElement('span');txt.className='task-txt';txt.textContent=task;
    label.appendChild(chk);label.appendChild(txt);
    label.addEventListener('click',function(){Store.toggleTask(globalDay,idx);label.classList.toggle('done');updateDayFooter(globalDay);renderAll();checkOverlay()});
    tl.appendChild(label)
  });
  updateDayFooter(globalDay);checkOverlay();
  let prevDay=currentTrack==='math'?MATH_TRACK.getPrevDay(globalDay):MAIN_PLAN.getPrevDay(globalDay);
  let nextDay=currentTrack==='math'?MATH_TRACK.getNextDay(globalDay):MAIN_PLAN.getNextDay(globalDay);
  document.getElementById('btn-prev').style.visibility=prevDay?'visible':'hidden';
  document.getElementById('btn-next').style.visibility=nextDay?'visible':'hidden';
  document.getElementById('btn-prev').textContent='← '+(currentTrack==='math'?'M':'')+'Day '+(prevDay||'');
  document.getElementById('btn-next').textContent=(currentTrack==='math'?'M':'')+'Day '+(nextDay||'')+' →';
  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-day').classList.add('active');
  document.getElementById('content').scrollTop=0
}

function updateDayFooter(globalDay){
  let plan=getPlan(),done=Store.isDayDone(globalDay);
  let data=Store.load(),dk='d'+globalDay;
  let doneCount=(data[dk]&&data[dk].tasks)?data[dk].tasks.filter(t=>t).length:0;
  let dd=plan.getDay(globalDay);let totalTasks=dd?dd.tasks.length:3;
  let el=document.getElementById('footer-status');
  if(done){el.textContent='Day '+globalDay+' — COMPLETE ✓';el.style.color='var(--success)'}else{el.textContent='Tasks: '+doneCount+'/'+totalTasks;el.style.color=''}
}

function updateStats(){
  let plan=getPlan(),done=Store.getDoneCount();
  let total=currentTrack==='math'?MATH_TRACK.allDays().length:plan.totalDays;
  let pct=total>0?Math.round(done/total*100):0,streak=Store.getStreak();
  document.getElementById('tb-done').textContent=done+'/'+total;
  document.getElementById('tb-pct').textContent=pct+'%';
  document.getElementById('tb-streak').textContent=streak+'d';
  document.getElementById('progress-bar').style.width=pct+'%';
  let badge=document.getElementById('tb-badge');badge.textContent=plan.name;
  document.querySelectorAll('.tb-track').forEach(t=>t.classList.toggle('active',t.getAttribute('data-track')===currentTrack));
  // Bento row
  let br=document.getElementById('bento-row');
  if(br)br.innerHTML='<div class="bento-card"><div class="bento-label">已完成</div><div class="bento-val accent">'+done+'<span style="font-size:16px;color:var(--text3)">/'+total+'</span></div></div><div class="bento-card"><div class="bento-label">进度</div><div class="bento-val">'+pct+'%</div><div class="bento-sub">'+plan.name+'</div></div><div class="bento-card"><div class="bento-label">连续学习</div><div class="bento-val">'+streak+'<span style="font-size:16px;color:var(--text3)"> 天</span></div></div>'
}

function checkOverlay(){
  let total=currentTrack==='math'?MATH_TRACK.allDays().length:MAIN_PLAN.totalDays;
  let allDone=true;
  if(currentTrack==='math'){MATH_TRACK.allDays().forEach(day=>{if(!Store.isDayDone(day.d))allDone=false})}
  else{for(let i=1;i<=total;i++){if(!Store.isDayDone(i)){allDone=false;break}}}
  let ov=document.getElementById('overlay');
  if(allDone&&total>0){ov.classList.add('show');document.getElementById('overlay-msg').textContent=(currentTrack==='math'?'Math Track':'Main Plan')+' Complete! 🎉'}else{ov.classList.remove('show')}
}

function goHome(){document.getElementById('view-day').classList.remove('active');document.getElementById('view-home').classList.add('active');document.getElementById('overlay').classList.remove('show');currentDay=null;renderAll()}
function goDay(d){currentDay=d;renderDay(d);renderSidebar();updateStats()}
function navDay(dir){let plan=getPlan(),next=dir>0?(currentTrack==='math'?MATH_TRACK.getNextDay(currentDay):plan.getNextDay(currentDay)):(currentTrack==='math'?MATH_TRACK.getPrevDay(currentDay):plan.getPrevDay(currentDay));if(next)goDay(next)}
function switchTrack(track){if(track===currentTrack)return;currentTrack=track;goHome()}
function switchTrackUI(){updateStats()}
var _toastTimer=null;
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(_toastTimer)clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
function copyPrompt(){let text=document.getElementById('prompt-body').textContent;navigator.clipboard.writeText(text).then(()=>{let btn=document.getElementById('copy-btn');btn.classList.add('copied');btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!';showToast('✓ Copied!');setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy'},1800)}).catch(()=>showToast('Copy failed'))}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open-mobile')}
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();let dayData=getPlan().getDay(currentDay);if(dayData){for(let i=0;i<dayData.tasks.length;i++){if(!Store.isTaskDone(currentDay,i)){document.querySelectorAll('#task-list .task-item')[i]?.click();break}}}}if(e.key==='Escape')goHome()});
document.addEventListener('DOMContentLoaded',function(){renderAll();goDay(1)});
</script>
</body>
</html>
